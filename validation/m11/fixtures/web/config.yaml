service:
  name: order-api
  port: 8080
  replicas: 3
  env:
    - name: DB_HOST
      value: localhost
    - name: LOG_LEVEL
      value: info

database:
  host: db.example.com
  port: 5432
  credentials:
    user: orders
    password: ${DB_PASSWORD}
  pool:
    max: 20
    min: 2

features:
  - name: auto-cancel
    enabled: true
    timeout_seconds: 300
  - name: fraud-check
    enabled: false

logging:
  level: debug
  format: json
  outputs:
    - console
    - file: /var/log/orders.log

metrics:
  enabled: true
  interval: 30s
