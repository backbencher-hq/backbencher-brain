# nodes and 98 node types on 1,905 corpus files. The `#import "<file>"` line is a
# COMMENT convention read by `graphql-import-node` and by `graphql-tools`, and the
# grammar DOES produce `comment` nodes (4,510 across 269 files), so this family is
# read off a named AST node's text rather than scanned for.
