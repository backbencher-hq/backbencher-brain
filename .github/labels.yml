# Label taxonomy for backbencher-hq/backbencher-brain.
#
# Apply to a repository (creates missing labels, updates existing ones):
#   script/release/sync-labels.sh [owner/repo]
#
# The lang:<name> labels are NOT listed here. They are generated by
# script/release/sync-labels.sh from SUPPORTED_LANGUAGES in src/ast/engine.ts, so a
# newly onboarded language gets its label on the next sync without a second edit.
# Keep this file to the 34 taxonomy labels below; per-language labels are derived.

labels:
  # --- type/* — what kind of change is this? ---------------------------------
  - name: "type/bug"
    color: "d73a4a"
    description: "Something behaves wrong: crash, wrong answer, broken install"
  - name: "type/feature"
    color: "0e8a16"
    description: "New capability, or an extension of an existing one"
  - name: "type/docs"
    color: "0075ca"
    description: "Documentation, generated reference pages, README copy"
  - name: "type/refactor"
    color: "fbca04"
    description: "Internal restructuring with no intended behaviour change"
  - name: "type/performance"
    color: "f9d0c4"
    description: "Speed, memory, index size or retrieval latency"
  - name: "type/test"
    color: "c2e0c6"
    description: "Tests, fixtures, gates or evidence harnesses"
  - name: "type/security"
    color: "b60205"
    description: "Security-sensitive change or hardening (no exploit details)"
  - name: "type/chore"
    color: "fef2c0"
    description: "Dependencies, CI, tooling, repository housekeeping"

  # --- area/* — which part of the product? -----------------------------------
  - name: "area/cli"
    color: "5319e7"
    description: "The bb command-line surface"
  - name: "area/mcp"
    color: "1d76db"
    description: "MCP server, tool registry and tool schemas"
  - name: "area/lsp"
    color: "0052cc"
    description: "Language server: hover, definitions, references, symbols"
  - name: "area/analyzers"
    color: "006b75"
    description: "Language analyzers, grammars and parser contracts"
  - name: "area/indexer"
    color: "6f42c1"
    description: "Index build, storage, schema and freshness"
  - name: "area/graph"
    color: "8250df"
    description: "Graph engine: callers/callees, impact and dependency map"
  - name: "area/website"
    color: "e99695"
    description: "backbencher.cc site, pages and generated data"
  - name: "area/install"
    color: "d4c5f9"
    description: "npm package, install scripts and upgrades"
  - name: "area/release"
    color: "91ca55"
    description: "Versioning, publishing, changelog and release automation"

  # --- claim/* — who is on it? ----------------------------------------------
  - name: "claim/available"
    color: "c2e0c6"
    description: "Unclaimed work — comment to take it"
  - name: "claim/claimed"
    color: "fbca04"
    description: "Someone is actively working on it"
  - name: "claim/released"
    color: "bfdadc"
    description: "No longer claimed; back in the pool"

  # --- workflow labels --------------------------------------------------------
  - name: "good first issue"
    color: "7057ff"
    description: "Small, self-contained and ready for a first contribution"
  - name: "help wanted"
    color: "008672"
    description: "Maintainers would welcome a contributor here"
  - name: "needs-repro"
    color: "d876e3"
    description: "Not reproducible yet; needs steps and environment"
  - name: "needs-evidence"
    color: "e4e669"
    description: "Needs a fixture, gate or record that proves the claim"
  - name: "blocked"
    color: "b60205"
    description: "Waiting on another issue, decision or upstream fix"
  - name: "question"
    color: "cc317c"
    description: "A question, not a defect report"

  # --- platform/* — where it reproduces --------------------------------------
  - name: "platform/linux"
    color: "0b7285"
    description: "Linux (glibc or musl)"
  - name: "platform/macos"
    color: "495057"
    description: "macOS on Apple silicon or Intel"
  - name: "platform/windows"
    color: "1c7ed6"
    description: "Native Windows (PowerShell / cmd)"
  - name: "platform/wsl"
    color: "6c757d"
    description: "Windows Subsystem for Linux"

  # --- priority/* — how soon --------------------------------------------------
  - name: "priority/p0"
    color: "b60205"
    description: "Drop everything: data loss, security, or unusable release"
  - name: "priority/p1"
    color: "d93f0b"
    description: "Should land in the next release"
  - name: "priority/p2"
    color: "fbca04"
    description: "Backlog, scheduled but not next"
  - name: "priority/p3"
    color: "c2e0c6"
    description: "Nice to have; no urgency"
