<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backbencher Visualizer</title>
<style>

  :root {
    color-scheme: dark;
    --bg: #0b0c0f;
    --side: #121419;
    --ink: #f2efe9;
    --muted: #a9a49b;
    --faint: #7c776d;
    --line: rgba(242, 239, 233, .10);
    --line-2: rgba(242, 239, 233, .20);
    --accent: #e7b56a;
    --accent-soft: rgba(231, 181, 106, .12);
    --warn: #e7b56a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 12.5px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased; }
  #workbench { display: grid; grid-template-columns: 336px minmax(0, 1fr); height: 100%; }
  #side { border-right: 1px solid var(--line); background: linear-gradient(180deg, #14161c, #0e1015);
    overflow-y: auto; overscroll-behavior: contain; padding: 22px 20px 18px; }
  #content { position: relative; min-width: 0; }
  #view { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }

  /* ── brand ───────────────────────────────────────────────────────────── */
  #brand { padding-bottom: 16px; }
  #brand .mark { color: var(--accent); font-size: 10px; letter-spacing: .22em; font-weight: 700; }
  #brand h1 { margin: 9px 0 3px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  #brand p { margin: 0; color: var(--faint); font-size: 11px; }

  /* ── sections ────────────────────────────────────────────────────────── */
  .sec { padding: 14px 0; border-top: 1px solid var(--line); }
  .secLabel { margin: 0 0 10px; font-size: 10px; font-weight: 600; letter-spacing: .17em;
    text-transform: uppercase; color: var(--faint); }
  .hide { display: none !important; }

  /* ── mode ────────────────────────────────────────────────────────────── */
  #modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mode { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    font: inherit; font-size: 11.5px; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 6px; }
  .mode:hover { color: var(--ink); border-color: var(--line-2); }
  .mode.active { color: var(--ink); border-color: rgba(231, 181, 106, .5); background: var(--accent-soft); }
  .mode .glyph { color: var(--accent); font-size: 12px; }

  /* ── layout choice ───────────────────────────────────────────────────── */
  /* The graph has two arrangements, and which one a reader wants is their call:
     the region map names the project's parts, and the plain force graph is the honest
     shape when those parts do not fall along directory lines. Both are here. */
  #layouts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .lay { font: inherit; font-size: 11.5px; color: var(--muted); cursor: pointer; text-align: center;
    background: transparent; border: 1px solid var(--line); border-radius: 9px; padding: 9px 6px; }
  .lay:hover { color: var(--ink); border-color: var(--line-2); }
  .lay.active { color: var(--ink); border-color: rgba(231, 181, 106, .5); background: var(--accent-soft); }
  .layHint { margin: 9px 0 0; color: var(--faint); font-size: 10.5px; line-height: 1.5; }

  /* ── live state ──────────────────────────────────────────────────────── */
  .live { color: var(--muted); font-variant-numeric: tabular-nums; }
  .live b { color: var(--ink); font-weight: 600; }
  .live .sep { color: var(--faint); padding: 0 5px; }
  /* A caveat the view marked as one, and an explanation that belongs in the same breath as
     the counts around it. Neither may be as loud as a headline number. */
  .live .warn { color: var(--warn); }
  .live .plain { color: var(--muted); }

  /* ── census ──────────────────────────────────────────────────────────── */
  .kv { display: grid; gap: 3px; font-variant-numeric: tabular-nums; }
  .kv .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .kv .v { font-weight: 600; }
  .kv .k { color: var(--muted); text-align: right; }
  .kv .warn .v { color: var(--warn); }
  .note { margin: 10px 0 0; color: var(--faint); font-size: 11px; line-height: 1.5; }

  /* ── filters ─────────────────────────────────────────────────────────── */
  .fgroup + .fgroup { margin-top: 14px; }
  .fhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
  .flab { color: var(--ink); font-size: 12px; }
  .fclear { font: inherit; font-size: 11px; color: var(--faint); background: none; border: 0;
    border-bottom: 1px dashed var(--line-2); cursor: pointer; padding: 0 0 1px; }
  .fclear:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .fopts { display: flex; flex-wrap: wrap; gap: 5px; }
  .fopt { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font: inherit;
    font-size: 11px; color: var(--ink); background: rgba(255, 255, 255, .03);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; }
  .fopt:hover { border-color: var(--line-2); }
  .fopt .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .fopt .sw.line { width: 16px; height: 0; border-top: 2px solid currentColor; border-radius: 0; }
  .fopt .sw.dashed { border-top-style: dashed; }
  .fopt .ct { color: var(--faint); font-variant-numeric: tabular-nums; }
  .fopt.off { color: var(--faint); background: none; }
  .fopt.off .sw { opacity: .3; }
  .fopt.off .ct { opacity: .5; }

  /* ── encoding key ────────────────────────────────────────────────────── */
  .key { display: grid; gap: 6px; }
  .krow { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11.5px; }
  .krow .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .krow .ring { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid; background: none; flex: none; }
  .krow .bar { width: 22px; height: 0; border-top-width: 2px; border-top-style: solid; flex: none; }
  .krow .langs { width: 14px; height: 9px; border-radius: 3px; flex: none;
    background: conic-gradient(#5eead4 0 25%, #a78bfa 0 50%, #fbbf24 0 75%, #60a5fa 0); }

  /* ── actions ─────────────────────────────────────────────────────────── */
  .actions { display: flex; gap: 6px; }
  .act { flex: 1; font: inherit; font-size: 11.5px; color: var(--ink); cursor: pointer;
    background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; }
  .act:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .act:disabled { color: var(--faint); cursor: default; opacity: .5; }

  /* ── downloads ───────────────────────────────────────────────────────── */
  .dls { display: grid; gap: 6px; }
  .dl { display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 10px; color: var(--ink); }
  .dl b { display: block; font-size: 11.5px; font-weight: 600; }
  .dl span { display: block; color: var(--faint); font-size: 10.5px; margin-top: 1px; }
  .dl:hover:not(:disabled) { border-color: var(--accent); }
  .dl:hover:not(:disabled) b { color: var(--accent); }
  .dl:disabled { opacity: .38; cursor: default; }

  #status { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line);
    color: var(--faint); font-size: 10.5px; }
  #status.flash { color: var(--accent); }

  @media (max-width: 900px) {
    #workbench { grid-template-columns: 1fr; grid-template-rows: minmax(200px, 42vh) minmax(0, 1fr); }
    #side { border-right: 0; border-bottom: 1px solid var(--line); }
    #modes { grid-template-columns: repeat(3, 1fr); }
  }

</style>
</head>
<body>
<main id="workbench">
<aside id="side" aria-label="Visualization panel">
<header id="brand">
<div class="mark">BB / VISUALIZE</div>
<h1 id="viewTitle">Graph</h1>
<p id="viewSub">bb_visualize &middot; self-contained &middot; no network</p>
</header>
<section class="sec" id="modeSection">
<h2 class="secLabel">Mode</h2>
<div id="modes" role="tablist" aria-label="Visualization mode">
<button class="mode active" type="button" role="tab" data-mode="graph" aria-selected="true"><span class="glyph">&#9678;</span>Graph</button>
<button class="mode" type="button" role="tab" data-mode="codemap" aria-selected="false" title="one rectangle per SYMBOL, area = the lines it spans — not a token-level code map"><span class="glyph">&#9638;</span>Symbol map</button>
<button class="mode" type="button" role="tab" data-mode="class" aria-selected="false" title="types with inheritance, implementation and containment only — no attributes, methods, cardinalities or visibility, because the index stores none"><span class="glyph">&#9671;</span>Type diagram</button>
</div>
</section>
<section class="sec" id="layoutSection">
<h2 class="secLabel">Layout</h2>
<div id="layouts"></div>
<p class="layHint" id="layoutHint"></p>
</section>
<section class="sec" id="liveSection">
<h2 class="secLabel">On screen</h2>
<div id="live" class="live">&mdash;</div>
</section>
<section class="sec" id="dataSection">
<h2 class="secLabel">Data</h2>
<div id="census" class="kv"></div>
<p id="note" class="note"></p>
<p id="fallback" class="note" hidden></p>
</section>
<section class="sec" id="filterSection">
<h2 class="secLabel">Filters</h2>
<div id="filters"></div>
</section>
<section class="sec" id="encodingSection">
<h2 class="secLabel">Encoding</h2>
<div id="encoding" class="key"></div>
</section>
<section class="sec" id="actionSection">
<h2 class="secLabel">View</h2>
<div class="actions">
<button class="act" id="fit" type="button">fit all</button>
<button class="act" id="clear" type="button">show everything</button>
</div>
<p class="note" id="viewNote"></p>
</section>
<section class="sec" id="downloadSection">
<h2 class="secLabel">Download</h2>
<div class="dls">
<button class="dl" type="button" data-dl="page"><b>page &middot; html</b><span>the whole viewer, offline</span></button>
<button class="dl" type="button" data-dl="json"><b>data &middot; json</b><span>everything behind this picture</span></button>
<button class="dl" type="button" data-dl="nodes"><b>nodes &middot; csv</b><span>one row per node or symbol</span></button>
<button class="dl" type="button" data-dl="edges"><b>edges &middot; csv</b><span>one row per stored edge</span></button>
</div>
</section>
<footer id="status" aria-live="polite">Type diagram view loaded</footer>
</aside>
<div id="content"><iframe id="view" title="Backbencher visualization"></iframe></div>
</main>

\"language\", o.crossLanguage ? (o.bridge || \"crosses a language boundary\") : \"within one language\"],\n         [\"stored rows\", o.occurrences ? (o.occurrences + (o.occurrences === 1 ? \" row\" : \" rows\")) : \"unknown\"],\n         [\"first row\", o.rowId || \"—\"],\n         [\"all rows\", o.rowIds && o.rowIds.length > 1 ? o.rowIds.length + \" carried\" : \"—\"],\n         [\"owner cascade\", o.ownerCascade ? \"yes — folded from a stored member row, attributed to this owner\" : \"no\"],\n         [\"matched member(s)\", o.matchedMembers && o.matchedMembers.length ? o.matchedMembers.join(\", \") : \"—\"],\n         [\"stale\", o.stale ? \"yes\" : \"no\"]];\n    dbody.innerHTML = \"\u003ch3>\" + (isLink ? \"Region link\" : isNode ? \"Symbol\" : \"Relationship\") + \"\u003c/h3>\u003cdl>\" +\n      rows.map(function (r) { return \"\u003cdt>\" + esc(r[0]) + \"\u003c/dt>\u003cdd>\" + esc(r[1]) + \"\u003c/dd>\"; }).join(\"\") + \"\u003c/dl>\";\n    if (dtitleEl) dtitleEl.textContent = summaryOf(o);\n    det.classList.add(\"on\");\n    document.body.classList.add(\"detail-open\");\n    applyPanel();\n    notify();\n  }\n\n  var input = document.getElementById(\"q\"), qstat = document.getElementById(\"qstat\");\n  input.addEventListener(\"input\", function () {\n    q = input.value; var v = q.toLowerCase();\n    var hits = v ? N.filter(function (n) { return (n.name || \"\").toLowerCase().indexOf(v) >= 0; }).length : 0;\n    qstat.textContent = v ? hits + \" match\" + (hits === 1 ? \"\" : \"es\") : \"\";\n    draw();\n    notify();\n  });\n\n  // ---- filters.\n  //\n  // Hiding is a DISPLAY decision: nothing leaves the data, the census keeps every\n  // row, and the downloads carry every node and edge. A filter that silently drops\n  // rows from the answer would be the same lie this file was fixed for twice.\n  // The state itself is declared with the renderer's other state, at the top.\n  function nodeHidden(nd) { return !!nd && (!!hiddenKinds[nd.type] || !!hiddenGroups[nd.group] || (!!hiddenFlags.isolated && !NODE_DEG[nd.id]) || !!hiddenModules[nd.module]); }\n  function edgeHidden(l) { return !!hiddenTypes[l.type] || nodeHidden(byId[l.source]) || nodeHidden(byId[l.target]); }\n  function filteredNodes() { var n = 0; for (var i = 0; i \u003c N.length; i++) if (!nodeHidden(N[i])) n++; return n; }\n  function filteredEdges() { var n = 0; for (var i = 0; i \u003c L.length; i++) if (!edgeHidden(L[i])) n++; return n; }\n  function toggleInto(map, key, show) { if (show) delete map[key]; else map[key] = 1; }\n  function filterOptions() {\n    var groups = {};\n    for (var i = 0; i \u003c N.length; i++) groups[N[i].group] = (groups[N[i].group] || 0) + 1;\n    var kinds = {};\n    for (var k = 0; k \u003c N.length; k++) kinds[N[k].type] = (kinds[N[k].type] || 0) + 1;\n    var out = [\n      { id: \"types\", label: \"Relationship types\",\n        options: types.map(function (t) { return { value: t, count: byType[t] || 0, color: col(t), dash: STRUCTURAL[t] ? \"solid\" : \"dashed\" }; }),\n        hidden: function (v) { return !!hiddenTypes[v]; },\n        set: function (v, show) { toggleInto(hiddenTypes, v, show); changed(); } },\n      { id: \"languages\", label: \"Languages\",\n        options: Object.keys(groups).sort().map(function (g) { return { value: g, count: groups[g], color: langColor(g) }; }),\n        hidden: function (v) { return !!hiddenGroups[v]; },\n        set: function (v, show) { toggleInto(hiddenGroups, v, show); changed(); } },\n      { id: \"kinds\", label: \"Symbol kinds\",\n        options: Object.keys(kinds).sort().map(function (t) { return { value: t, count: kinds[t] }; }),\n        hidden: function (v) { return !!hiddenKinds[v]; },\n        set: function (v, show) { toggleInto(hiddenKinds, v, show); changed(); } },\n      // The regions are the map's own vocabulary now, so they get a control too: a\n      // module the reader is not working on can be turned off without a scope change.\n      { id: \"modules\", label: \"Modules\",\n        options: MODULES.map(function (m) { return { value: m, count: (MODULE_MEMBERS[m] || []).length }; }),\n        hidden: function (v) { return !!hiddenModules[v]; },\n        set: function (v, show) { toggleInto(hiddenModules, v, show); changed(); } }\n    ];\n    if (isolatedCount > 0) out.push({ id: \"connectivity\", label: \"Connectivity\",\n      options: [{ value: \"isolated\", count: isolatedCount }],\n      hidden: function (v) { return !!hiddenFlags[v]; },\n      set: function (v, show) { toggleInto(hiddenFlags, v, show); changed(); } });\n    return out;\n  }\n  /** The region links this frame is drawing, and where they run on screen.\n   *\n   *  The overview draws a summary instead of every cross-region edge, and a summary that\n   *  can only be SEEN is a summary that cannot be checked. This is the same list the\n   *  canvas strokes, with each link's midpoint in canvas coordinates, so the sentence in\n   *  the readout has data behind it. */\n  function regionLinks() {\n    var out = [];\n    for (var li = 0; li \u003c lastBundles.length; li++) {\n      var lb = lastBundles[li], lc = lastCent[lb.a], ld = lastCent[lb.b];\n      if (!lc || !ld) continue;\n      out.push({\n        key: lb.key, a: lb.a, b: lb.b,\n        count: lb.count, rows: lb.rows,\n        type: lb.dominantRelationship || lb.type, heaviest: lb.heaviest,\n        from: { x: lc[0], y: lc[1] }, to: { x: ld[0], y: ld[1] },\n        mid: { x: (lc[0] + ld[0]) / 2, y: (lc[1] + ld[1]) / 2 },\n      });\n    }\n    return out;\n  }\n  function viewState() {\n    return { visibleNodes: filteredNodes(), totalNodes: N.length, visibleEdges: filteredEdges(), totalEdges: L.length,\n             // The summary, so the sidebar's live line can say that the canvas is\n             // drawing region links rather than the individual cross-region edges.\n             regionLinks: lastBundles.length, linkPairs: lastPairs, crossRegionEdgesOnFrame: lastCross,\n             zoom: view.k,\n             // A selected link names the two regions, because \"regionLink\" is the kind of\n             // thing it is and not the answer to \"what did I just pick\".\n             selected: sel ? (sel.name || (sel.kind === \"regionLink\" ? sel.a + \" to \" + sel.b : null) || sel.type || null) : null,\n             // Which layout is on screen and where the relationship box is, so the sidebar\n             // (or a reader checking the picture) can read both rather than infer them.\n             layout: LAYOUT, panel: panelState(), onScreen: onScreenRows() };\n  }\n  function notify() { /* the shell polls state(); a cross-frame event would be redundant */ }\n  function changed() { grid = null; draw(); if (!userMoved) fitAll(); notify(); }\n  /** The rows the sidebar's On screen line prints, in THIS view's own words.\n   *\n   * MEASURED in the sidebar's own source and in the browser gate: this sentence used to be\n   * composed by the SHELL, out of st.visibleNodes / st.visibleEdges / st.regionLinks -- so\n   * the mount had to know what a region link is, and a view mounted in place of the graph\n   * would have been described in the graph's vocabulary and its own counts. It does not\n   * have to: the view publishes the rows it wants printed and the shell prints them, which\n   * is the same division of labour the census already uses.\n   */\n  function onScreenRows() {\n    var shownNodes = filteredNodes(), shownEdges = filteredEdges();\n    var out = [row(\"nodes\", shownNodes + \" of \" + N.length), row(\"edges\", shownEdges + \" of \" + L.length)];\n    var hidden = (N.length - shownNodes) + (L.length - shownEdges);\n    if (hidden > 0) out.push({ label: \"\", value: hidden + \" hidden by filters\", warn: true });\n    // The overview draws a REGION LINK per region pair rather than each cross-region edge,\n    // so this line and the ~40 lines on the canvas would otherwise contradict each other.\n    // MEASURED in the artifact: the sidebar is where a reader checks what is on screen, so\n    // the reconciliation belongs here and not only in the frame's own readout.\n    if (lastBundles.length > 0) {\n      out.push({ label: \"edges on screen\", tone: \"plain\", value: lastBundles.length + (lastBundles.length === 1 ? \" region link stands\" : \" region links stand\") +\n        \" for \" + lastCross + \" cross-region edges\" + (lastPairs > lastBundles.length ? \" (heaviest \" + lastBundles.length + \" of \" + lastPairs + \" pairs)\" : \"\") });\n    }\n    out.push(row(\"layout\", LAYOUT));\n    // A selected link names the two regions, because \"regionLink\" is the kind of thing it\n    // is and not the answer to \"what did I just pick\".\n    var name = sel ? (sel.name || (sel.kind === \"regionLink\" ? sel.a + \" to \" + sel.b : null) || sel.type || null) : null;\n    if (name) out.push(row(\"selected\", name));\n    return out;\n  }\n  window.__bbView = {\n    kind: \"graph\",\n    title: \"Architecture Map\",\n    subtitle: \"bb_visualize \\u00b7 self-contained \\u00b7 no network\",\n    census: censusRows,\n    note: excludedNote,\n    legend: legendRows,\n    encoding: encodingRows,\n    filters: filterOptions,\n    state: viewState,\n    hint: \"drag to pan · scroll to zoom · click a node to focus, an edge to frame both ends, double-click a node to fill the view with its neighbours\",\n    links: regionLinks,\n    // The layouts this document can draw, and which one is on screen. Published so the\n    // sidebar can offer the choice -- and so the choice can be CHECKED, rather than\n    // inferred from what the pixels happen to look like.\n    layouts: function () { return [\n      { value: \"regions\", label: \"Regions\", hint: \"group symbols into the directory they live in: named pods, and one dotted region link per region pair at the overview\" },\n      { value: \"force\", label: \"Force\", hint: \"no directories: one force layout, no pods and no region links, every edge drawn as itself\" }\n    ]; },\n    layout: function () { return LAYOUT; },\n    setLayout: function (next) {\n      var mode = next === \"force\" ? \"force\" : \"regions\";\n      if (mode === LAYOUT) return LAYOUT;\n      LAYOUT = mode;\n      document.documentElement.setAttribute(\"data-bb-layout\", LAYOUT);\n      // A picked region link does not exist in the other layout: drop the pick rather\n      // than keep a panel open about a line that is no longer on the screen.\n      sel = null; hover = null; selLinkKey = null; hoverLinkKey = null;\n      show(null);\n      restartLayout();\n      return LAYOUT;\n    },\n    // Where the box sits and whether it is collapsed: the reader's state, published for\n    // the same reason the links are -- a state that can only be seen cannot be checked.\n    panel: panelState,\n    setPanel: setPanel,\n    data: function () { return G; },\n    fit: function () { fitAll(); },\n    reset: function () { hiddenTypes = {}; hiddenGroups = {}; hiddenKinds = {}; hiddenFlags = {}; hiddenModules = {}; selLinkKey = null; hoverLinkKey = null; changed(); },\n    saveHtml: function () { return saveSelf(\"bb-architecture-map.html\"); }\n  };\n  // The grid and the adjacency table need settled positions, so they are built\n  // once the layout reports done and rebuilt if it is still running when the first\n  // frame is painted.\n  buildAdjacency();\n  function ensureIndexes() { if (!grid) buildGrid(); }\n  if (lay && lay.done()) ensureIndexes();\n  else if (progressEl) {\n    var waited = 0;\n    var idxTimer = setInterval(function () {\n      waited += 120;\n      if (!lay || lay.done()) { ensureIndexes(); clearInterval(idxTimer) }\n      else if (waited > 30000) { ensureIndexes(); clearInterval(idxTimer) }\n    }, 120);\n  }\n  window.addEventListener(\"resize\", function () { resize(); if (!userMoved) fitAll(); else draw(); notify(); });\n  resize(); draw();\n  notify();\n  if (N.length === 0) {\n    var emptyEl = document.getElementById(\"shown\");\n    if (emptyEl) { emptyEl.style.display = \"block\"; emptyEl.textContent = \"no nodes in this slice\"; }\n  }\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>","codemap":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\" data-bb-view=\"codemap\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Backbencher Symbol Map\u003c/title>\n\u003cstyle>\n  :root{\n    --bg:#08080c; --panel:rgba(16,17,26,.86); --edge:rgba(255,255,255,.14);\n    --text:#e8eaf0; --muted:#8b90a0; --accent:#5eead4; --warn:#fbbf24;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);\n    font:13px/1.5 ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n    overflow:hidden}\n  /* The map owns the WHOLE frame and clips its own overflow.\n     MEASURED, in order: the document used to draw its own sidebar down the left, so the\n     map started at left:322px; and before that it used inset:0 against a TRANSLUCENT\n     sidebar, which let the world show through the legend while the reader panned. The\n     sidebar now belongs to the composed viewer, so the document is the picture and\n     nothing else -- there is no column here to avoid, and no panel to read through. */\n  #map{position:absolute;inset:0;overflow:hidden;cursor:default}\n  /* The world is a fixed 2400x1600 coordinate space placed inside the viewport with\n     a transform. Zooming moves the transform rather than re-laying out, so a wheel\n     event is one composited write instead of 2,111 layout updates -- which is what\n     makes zooming feel like zooming instead of like a pause. */\n  #world{position:absolute;left:0;top:0;width:2400px;height:1600px;will-change:transform}\n  #map.panning{cursor:grabbing}\n  /* A file's name, sized in WORLD units so it grows with the zoom. 13px here is\n     deliberate: the map opens at FIT_SCALE 0.82, so this lands at 10.7px at rest and\n     33px when fully zoomed in. Sized in screen pixels instead, MEASURED, the names\n     opened at 9px -- illegible -- and the group labels ballooned to 26px the moment\n     the reader zoomed, because the two were on different scales. */\n  .fname{position:absolute;font-size:13px;line-height:17px;color:#eef2ff;pointer-events:auto;\n    cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;\n    background:linear-gradient(90deg,rgba(6,8,16,.92),rgba(6,8,16,.66));\n    border-left:2px solid rgba(94,234,212,.75);text-shadow:0 1px 2px rgba(0,0,0,.9)}\n  .fname:hover{background:rgba(94,234,212,.22);color:#fff}\n  /* A SYMBOL's name carries the same bar as a file's, with a white rule instead of the accent\n     one: the picture can now name the STRIPE it draws (see chooseLabels), and a reader has to\n     be able to tell a cell's name from a stripe's at a glance. */\n  .fname.sym-name{border-left-color:rgba(255,255,255,.5);\n    background:linear-gradient(90deg,rgba(6,8,16,.95),rgba(6,8,16,.78))}\n  /* Everything that floats over the map is ONE kind of thing, and there are four of\n     them: where you look (the search), what just happened (the zoom readout), the\n     first-run hint, and what you picked (the detail box).\n\n     The census, the symbol kinds, the filter chips, the layout choice and the save\n     control are NOT here. They belong to the one sidebar of the composed viewer, and\n     this document no longer draws them: the review of the graph view was explicit that\n     the drawing should be the screen and everything else one column beside it, and a\n     view that keeps a second copy of those panels in a corner of the picture is\n     exactly the defect that pass removed. What is left is the picture, the search, the\n     readout that changes, and the box that answers what you picked. */\n  .ov{position:absolute;z-index:3;background:var(--panel);border:1px solid var(--edge);\n    border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}\n  #search{right:14px;top:14px;z-index:4;padding:8px 10px;display:flex;gap:8px;align-items:center}\n  #search input{background:rgba(0,0,0,.35);border:1px solid var(--edge);color:var(--text);\n    border-radius:9px;padding:8px 11px;width:220px;outline:none;font:inherit}\n  #search input:focus{border-color:var(--accent)}\n  #qstat{color:var(--muted);font-size:11.5px;min-width:52px}\n  /* The readout is a pill at the bottom centre and it is OPAQUE: a translucent panel\n     let the map read through it, which looked like the pill itself was wrong. */\n  #zoomstate{display:none;left:50%;transform:translateX(-50%);bottom:14px;border-radius:999px;\n    padding:6px 13px;font-size:11.5px;color:var(--muted);white-space:nowrap}\n  #zoomstate.on{display:block}\n  #zoomhint{left:50%;transform:translateX(-50%);bottom:44px;border-radius:999px;\n    padding:6px 14px;font-size:11.5px;color:var(--muted);white-space:nowrap;pointer-events:none;\n    transition:opacity .45s ease}\n  #zoomhint.gone{opacity:0;pointer-events:none}\n  body.detail-open #zoomhint{opacity:0;pointer-events:none}\n  /* The picked-item box: TWO controls for two different intentions.\n\n     MEASURED on the graph view, and applied here before it was ever reported rather\n     than after: the X used to be the only exit from this panel AND it cleared the\n     selection, so getting the box out of the way to see the whole picture cost the\n     reader the pick and the zoom they had just asked for. Hiding a panel is not\n     clearing a selection. Collapsing keeps the selection and narrows the box to its\n     own heading, and the heading always names what is picked -- so a collapsed panel is\n     never a panel you have to reopen to remember. */\n  #detail{right:14px;bottom:14px;padding:11px 12px 12px;max-width:380px;max-height:46vh;\n    overflow:auto;display:none;transition:max-width .2s ease,opacity .2s ease}\n  #detail.on{display:block}\n  #detail.collapsed{padding:8px 12px;max-width:none;overflow:hidden}\n  #detail.collapsed #dbody{display:none}\n  #dhead{display:flex;align-items:center;gap:8px}\n  #dtitle{flex:1;min-width:0;font-size:11.5px;color:var(--text);overflow:hidden;\n    text-overflow:ellipsis;white-space:nowrap}\n  #detail.collapsed #dtitle{color:var(--muted)}\n  .ctls{display:flex;align-items:center;gap:1px;flex:none}\n  .ctl{background:none;border:0;font:inherit;font-size:12px;line-height:1;color:var(--muted);\n    cursor:pointer;padding:3px 6px;border-radius:6px}\n  .ctl:hover{color:var(--accent);background:rgba(255,255,255,.07)}\n  .ctl:focus-visible{outline:1px solid var(--accent)}\n  #detail h3{margin:7px 0 6px;font-size:13px}\n  #detail dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;\n    font-variant-numeric:tabular-nums}\n  #detail dt{color:var(--muted)} #detail dd{margin:0;word-break:break-all}\n  @media (max-width:760px){#zoomhint{display:none}#search input{width:150px}}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"map\">\u003cdiv id=\"world\">\u003c/div>\u003c/div>\n\u003cdiv class=\"ov\" id=\"search\">\n  \u003cinput id=\"q\" placeholder=\"Find a file or symbol&hellip;\" autocomplete=\"off\" spellcheck=\"false\">\n  \u003cspan id=\"qstat\">\u003c/span>\n\u003c/div>\n\u003cdiv class=\"ov\" id=\"zoomstate\">\u003c/div>\n\u003cdiv class=\"ov\" id=\"zoomhint\">scroll to zoom &middot; drag to pan &middot; double-click a file to fill the frame with it &middot; click a file or symbol for its stored facts\u003c/div>\n\u003cdiv class=\"ov\" id=\"detail\" role=\"dialog\" aria-label=\"What you picked\">\n  \u003cdiv id=\"dhead\">\u003cspan id=\"dtitle\">nothing picked\u003c/span>\u003cspan class=\"ctls\">\u003cbutton class=\"ctl\" id=\"dcollapse\" type=\"button\" aria-expanded=\"true\" title=\"collapse this panel and keep the selection\">&#9662;\u003c/button>\u003cbutton class=\"ctl\" id=\"dclose\" type=\"button\" title=\"close and clear the selection\">&#10005;\u003c/button>\u003c/span>\u003c/div>\n  \u003cdiv id=\"dbody\">\u003c/div>\n\u003c/div>\n\u003cnoscript>\u003cp style=\"padding:24px\">This map needs JavaScript. The data is embedded below.\u003c/p>\u003c/noscript>\n\n\u003cscript id=\"bb-graph-data\" type=\"application/json\">\n{\"symbols\":[{\"id\":\"182472f0cc4019b44c54adc197798ce075faa1c6:class-diagram-renderer.ts:assemble:44\",\"name\":\"assemble\",\"group\":\"typescript\",\"val\":1.5,\"type\":\"function\",\"filePath\":\"class-diagram-renderer.ts\",\"line\":44,\"lineEnd\":46,\"qualifiedName\":\"class-diagram-renderer.assemble\",\"gravity\":182,\"stale\":false},{\"id\":\"182472f0cc4019b44c54adc197798ce075faa1c6:class-diagram-renderer.ts:assertClassDiagramParses:916\",\"name\":\"assertClassDiagramParses\",\"group\":\"typescript\",\"val\":2.5,\"type\":\"function\",\"filePath\":\"class-diagram-renderer.ts\",\"line\":916,\"lineEnd\":923,\"qualifiedName\":\"class-diagram-renderer.assertClassDiagramParses\",\"gravity\":46,\"stale\":false},{\"id\":\"182472f0cc4019b44c54adc197798ce075faa1c6:code-map-renderer.ts:assertCodeMapParses:1623\",\"name\":\"assertCodeMapParses\",\"group\":\"typescript\",\"val\":2.5,\"type\":\"function\",\"filePath\":\"code-map-renderer.ts\",\"line\":1623,\"lineEnd\":1630,\"qualifiedName\":\"code-map-renderer.assertCodeMapParses\",\"gravity\":46,\"stale\":false},{\"id\":\"182472f0cc4019b44c54adc197798ce075faa1c6:class-diagram-renderer.ts:CLASS_SCRIPT:166\",\"name\":\"CLASS_SCRIPT\",\"group\":\"typescript\",\"val\":2,\"type\":\"constant\",\"filePath\":\"class-diagram-renderer.ts\",\"line\":166,\"lineEnd\":914,\"qualifiedName\":\"class-diagram-renderer.CLASS_SCRIPT\",\"gravity\":43,\"stale\":false},{\"id\":\"182472f0cc4019b44c54adc197798ce075faa1c6:code-map-renderer.ts:CODE_MAP_SCRIPT:185\",\"name\":\"CODE_MAP_SCRIPT\",\"group\":\"typescript\",\"val\":2,\"type\":\"constant\",\"filePath\":\"code-map-renderer.ts\",\"line\":185,\"lineEnd\":1620,\"qualifiedName\":\"code-map-renderer.CODE_MAP_SCRIPT\",\"gravity\":43,\"stale\":false},{\"id\":\"182472f0cc4019b44c54adc ualifiedName\":\"class-diagram-renderer.BT\",\"gravity\":12,\"stale\":false},{\"id\":\"182472f0cc4019b44c54adc197798ce075faa1c6:class-diagram-renderer.ts:SENTINEL:35\",\"name\":\"SENTINEL\",\"group\":\"typescript\",\"val\":1.5,\"type\":\"constant\",\"filePath\":\"class-diagram-renderer.ts\",\"line\":35,\"lineEnd\":35,\"qualifiedName\":\"class-diagram-renderer.SENTINEL\",\"gravity\":12,\"stale\":false},{\"id\":\"182472f0cc4019b44c54adc197798ce075faa1c6:code-map-renderer.ts:BT:54\",\"name\":\"BT\",\"group\":\"typescript\",\"val\":1.5,\"type\":\"constant\",\"filePath\":\"code-map-renderer.ts\",\"line\":54,\"lineEnd\":54,\"qualifiedName\":\"code-map-renderer.BT\",\"gravity\":12,\"stale\":false},{\"id\":\"182472f0cc4019b44c54adc197798ce075faa1c6:code-map-renderer.ts:SENTINEL:55\",\"name\":\"SENTINEL\",\"group\":\"typescript\",\"val\":1.5,\"type\":\"constant\",\"filePath\":\"code-map-renderer.ts\",\"line\":55,\"lineEnd\":55,\"qualifiedName\":\"code-map-renderer.SENTINEL\",\"gravity\":12,\"stale\":false},{\"id\":\"182472f0cc4019b44c54adc197798ce075faa1c6:map-renderer.ts:assemble:25\",\"name\":\"assemble\",\"group\":\"typescript\",\"val\":1.5,\"type\":\"function\",\"filePath\":\"map-renderer.ts\",\"line\":25,\"lineEnd\":27,\"qualifiedName\":\"map-renderer.assemble\",\"gravity\":2,\"stale\":false},{\"id\":\"182472f0cc4019b44c54adc197798ce075faa1c6:code-map-renderer.ts:assemble:64\",\"name\":\"assemble\",\"group\":\"typescript\",\"val\":1.5,\"type\":\"function\",\"filePath\":\"code-map-renderer.ts\",\"line\":64,\"lineEnd\":66,\"qualifiedName\":\"code-map-renderer.assemble\",\"gravity\":2,\"stale\":false}],\"excluded\":{\"symbols\":0,\"byPattern\":{},\"byRule\":{},\"suffixes\":[\".d.ts\",\".min.js\",\".map\"],\"patterns\":[\"node_modules\",\".git\",\".next\",\".turbo\",\".cache\",\"coverage\",\"dist\",\"build\",\"out\",\"target\",\"vendor\",\"__pycache__\"],\"includesTestFiles\":true},\"scope\":\"project\",\"target\":null,\"totalNodesAvailable\":29,\"shownNodes\":29}\n\u003c/script>\n\u003cscript>\n(function () {\n  \"use strict\";\n  var G = JSON.parse(document.getElementById(\"bb-graph-data\").textContent);\n  var S = G.symbols || [];\n  var map = document.getElementById(\"map\");\n  // `world` is DECLARED here, and this line is a fix rather than tidying.\n  //\n  // A browser exposes every element with an id as a global: with id=\"world\" in the markup,\n  // a bare `world` anywhere in this script resolves to that element -- named access on the\n  // window object. So `applyView(world)` in zoomAt() and fitWorld() worked in a browser\n  // while referencing no binding at all in this file, and the defect was invisible until\n  // the emitted document was executed somewhere a browser's implicit globals do not exist.\n  // MEASURED by executing the artifact against a stub DOM (script/m13/verify-visualize-\n  // codemap.ts): the very first `draw(); fitWorld()` threw \"world is not defined\", the catch\n  // block swallowed it into the zoom pill, and the map opened at the fitted SCALE with an\n  // unframed position -- a defect a screenshot of the top-left corner would have been read\n  // as a panning accident. An id is not a variable; the binding is stated.\n  var world = document.getElementById(\"world\")\n  var sel = null, hover = null, q = \"\", groupBy = \"dir\", box, panelCollapsed = false, SYM_IDX = null\n  // Filters, declared with the renderer's other state.\n  //\n  // Hiding is a DISPLAY decision, and on a treemap it has to be: the areas encode line\n  // spans and every file cell is sized from them, so a filter that REMOVED a symbol's\n  // band would punch a hole where code demonstrably is and make the picture lie about the\n  // one property this view exists to show. A hidden band is therefore drawn MUTED -- the\n  // area stays true, the census keeps every row, and the data port keeps every symbol.\n  // MEASURED before this pass: the map had no filters at all, so the only way to isolate\n  // a symbol kind or a language was to leave the picture and read the JSON.\n  var hiddenKinds = {}, hiddenLangs = {}\n  // The counts the LAST draw actually produced. state() reads them, so the live line in\n  // the sidebar cannot disagree with the frame it describes.\n  var last = { syms: 0, lines: 0, files: 0, hits: 0, groups: 0, muted: 0, groupKeys: [], stripes: 0, foldedSyms: 0, foldedFiles: 0, named: 0, unnamedSmall: 0, unnamedBudget: 0, minStripePx: 0, zoom: 1 }\n  // ---- the world and the view onto it.\n  //\n  // The treemap is laid out into a FIXED world rather than into the viewport's pixel\n  // size. That is what makes zooming possible at all: if the layout is recomputed to\n  // fill whatever space it is given, there is no larger coordinate space to move\n  // through, and a wheel event can only rescale pixels that are already sub-pixel.\n  //\n  // The world is sized from the VIEWPORT, not fixed, and that is a deliberate\n  // correction. A fixed 2400x1600 world against a ~974px viewport fitted at 41%, so\n  // every file name opened at 4px -- MEASURED, and the labels I had just added were\n  // unreadable at the scale the map opens at. The world now measures the viewport\n  // divided by FIT_SCALE, so \"fit\" lands at 82% and labels open near their natural\n  // size, while the zoom range still spans 0.08x to 24x: enough depth to go from the\n  // whole map down to one symbol's bands.\n  //\n  // The world is still its own coordinate space, which is what makes zooming work at\n  // all -- a treemap laid out directly into the viewport's pixels has nothing larger\n  // to move through.\n  var FIT_SCALE = 0.82\n  // ---- LEVEL OF DETAIL. This is the reason the map was unreadable at scale.\n  //\n  // MEASURED on the emitted document over src/ (142 files, 1,770 symbols, 3,232 painted\n  // stripes), in a real browser: 1,633 of those stripes were UNDER ONE DEVICE PIXEL tall\n  // (median 0.94px), cyan covered 52.9% of the frame, and the tone that means \"the code\n  // between symbols\" did not reach the top 14 colours at all. The picture was one wash of\n  // the commonest kind, and a reporter's summary of it was exactly right: \"the only thing I\n  // see is cyan throughout, nothing is readable\".\n  //\n  // A stripe under a pixel is not a small symbol, it is a SMEAR, and drawing 1,633 of them\n  // is what made the map a single colour. So a RUN of symbols whose stripes would land under\n  // MIN_STRIPE_PX device pixels is drawn as ONE strip whose slices are the lines each kind\n  // spans, in source order. The area contract is untouched -- a slice is as tall as the lines\n  // its kind covers -- and so is the muted tone (a muted symbol's slice is the muted colour).\n  // Nothing is dropped or hidden: positions are unchanged, the census keeps every row, and\n  // the folded count is named in the readout and in the encoding key.\n  //\n  // The threshold is DEVICE pixels and the layout is WORLD pixels, so it is converted at the\n  // zoom being drawn: MIN_STRIPE_PX / view.k. That is what makes zooming mean something --\n  // scroll in and the same file is redrawn with its stripes back, one relayout per gesture\n  // (scheduleLod), rather than the 2,111 layout updates per wheel event the transform-only\n  // zoom was written to avoid.\n  var MIN_STRIPE_PX = 2\n  // How many names may be printed at the fit scale. MEASURED at fit over src/: 59 of 142\n  // files were named and 21 of those 59 names were CUT OFF with an ellipsis, so the budget\n  // was set to 32 to buy back room. That reason no longer holds: fitWidth now prints a name\n  // WHOLE or not at all and drops what does not fit, so clipping is impossible at any budget,\n  // and all 32 bought was an emptier picture. MEASURED on the same scope in the same browser:\n  // 140 files on screen, 39 names drawn, 111 candidates dropped BY THE BUDGET ALONE -- names\n  // that fit their own cell and lost a queue, which is the one reason to withhold a name that\n  // costs the reader something for not away -- or the other way round, on a tree of small files.\n      if (chosen.length >= budget || used[cand.kind] >= Math.ceil(budget / 2)) { over++; continue }\n      var labelW = cand._need\n      // A stripe that starts under the cell's own header cannot be named AT its start without\n      // landing on that header -- and the header is the cell's name, so the symbol would simply\n      // lose. MEASURED on a fixture with one 9,000-line method: the method's stripe begins at 0.1%\n      // of its cell, the file's name is printed there, and the largest symbol in the picture went\n      // unnamed because of a one-pixel overlap. A stripe with room moves its name DOWN, below the\n      // 17px header, and keeps it. Hiding a name to avoid a clash is not a collision policy.\n      var ly = cand.y\n      if (cand.kind === \"sym\" && cand.cellTop != null && cand.y - cand.cellTop \u003c 19 && cand.h >= 35) ly = cand.cellTop + 18\n      var clash = false\n      for (var lb = 0; lb \u003c labelBoxes.length; lb++) {\n        var L = labelBoxes[lb]\n        if (cand.x \u003c L[2] && cand.x + labelW > L[0] && ly \u003c L[3] && ly + 17 > L[1]) { clash = true; break }\n      }\n      if (clash) { over++; continue }\n      labelBoxes.push([cand.x, ly, cand.x + labelW, ly + 17])\n      cand.labelW = labelW\n      cand.labelY = ly\n      cand.text = cand._text\n      used[cand.kind]++\n      chosen.push(cand)\n    }\n    return { chosen: chosen, small: small, over: over, files: used.file, syms: used.sym }\n  }\n\n  // ---- WHAT THE SIDEBAR RENDERS: the census, the kinds, the keys, the chips.\n  //\n  // These were innerHTML written into this document's own panel. The reader asked for the\n  // drawing to be the screen and the data to live in one column beside it, so the counting\n  // is unchanged and only the destination is: every function below returns (label, value,\n  // warn) rows or (value, count, colour) chips for the mount to render. Nothing here paints.\n  function row(k, v, warn) { return { label: k, value: v, warn: !!warn } }\n  function kindCounts() {\n    var kinds = {}\n    for (var i = 0; i \u003c S.length; i++) { var k0 = S[i].type || \"unknown\"; kinds[k0] = (kinds[k0] || 0) + 1 }\n    return kinds\n  }\n  function staleCount() { var n = 0; for (var i = 0; i \u003c S.length; i++) if (S[i].stale) n++; return n }\n  /** How much of the drawn area the largest symbols hold, and it is the answer to \"why is this\n   *  picture one colour\".\n   *\n   *  MEASURED over src/ (200 symbols, 64,405 lines spanned): the largest 20 symbols are 57.9%\n   *  of the area, and the single largest -- RealCppAnalyzer.analyze -- spans 3,500 of its file's\n   *  6,183 lines. The wash a reader sees is not the renderer mis-colouring: 93.7% of the spanned\n   *  lines in that scope ARE functions and methods, so the map is drawing the shape of the\n   *  codebase. This row is published because a reader who is told it looks concentrated deserves\n   *  to know that it IS concentrated, and by how much. */\n  var CONCENTRATION = null\n  function concentration() {\n    if (CONCENTRATION) return CONCENTRATION\n    var spans = [], total = 0\n    for (var i = 0; i \u003c S.length; i++) { var sp = spanOf(S[i]); spans.push(sp); total += sp }\n    spans.sort(function (a, b) { return b - a })\n    var n = Math.min(20, spans.length), sum = 0\n    for (var j = 0; j \u003c n; j++) sum += spans[j]\n    CONCENTRATION = { count: n, pct: total ? Math.round(100 * sum / total) : 0 }\n    return CONCENTRATION\n  }\n  function groupUnit() { return groupBy === \"lang\" ? \"languages\" : last.groups === 1 ? \"directory\" : \"directories\" }\n  function censusRows() {\n    var out = [row(\"files\", last.files), row(\"symbols\", last.syms), row(\"lines spanned\", fmt(last.lines)),\n      row(groupUnit(), last.groups)]\n    // What this map does NOT show, stated on its face rather than left to be discovered. A\n    // rectangle map makes it especially easy to believe you are looki
