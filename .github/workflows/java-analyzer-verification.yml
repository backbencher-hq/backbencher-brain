name: Java analyzer semantic verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ast/real-java-analyzer.ts'
      - 'src/ast/parallel-indexer.ts'
      - 'src/ast/member-owner-resolution.ts'
      - 'src/lsp/graph_request.ts'
      - 'src/lsp/graph_usages.ts'
      - 'script/m14/java-m12-mismatch-census.ts'
      - 'script/m14/java-store-e2e-smoke.ts'
      - 'validation/m14/fixtures/java/**'
      - 'validation/m14/verification/JavaAnalyzerSemanticOracle.java'
      - 'validation/m14/verification/JavaM12CompilerAdjudication.java'
      - '.github/workflows/java-analyzer-verification.yml'
  workflow_dispatch:

jobs:
  java-semantic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for the pre-fix red-control comparison
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Typecheck production TypeScript
        run: npm run typecheck
      - name: All Java M14 fixtures, with explicit failure-count assertion
        shell: bash
        run: |
          set -euo pipefail
          bun run script/m14/run-fixtures.ts --lang java | tee java-fixtures.log
          python3 - <<'PY'
          import json, pathlib, re
          log = pathlib.Path("java-fixtures.log").read_text()
          summaries = re.findall(r"^summary:\s*(\{.*\})\s*$", log, re.MULTILINE)
          assert summaries, "fixture runner did not emit a machine-readable summary"
          java = json.loads(summaries[-1])["java"]
          assert java["pass"] >= 104, f"expected at least 104 Java fixture passes, got {java}"
          assert java["fail"] == 0, f"Java fixtures failed: {java}"
          print("Java fixture gate verified:", java)
          PY
      - name: Prove the new fixtures catch the pre-fix defects
        shell: bash
        run: |
          set -euo pipefail
          cp src/ast/real-java-analyzer.ts /tmp/bb-fixed-java-analyzer.ts
          git show 29a579243458490ff23d8de3f7f8f46aad120a43:src/ast/real-java-analyzer.ts > src/ast/real-java-analyzer.ts
          bun run script/m14/run-fixtures.ts --lang java | tee /tmp/java-prefixed-baseline.log || true
          python3 - <<'PY'
          import json, pathlib, re
          content = pathlib.Path("/tmp/java-prefixed-baseline.log").read_text()
          summaries = re.findall(r"^summary:\s*(\{.*\})\s*$", content, re.MULTILINE)
          assert summaries, "pre-fix fixture run did not emit a summary"
          java = json.loads(summaries[-1])["java"]
          expected_failures = {
              "java/framework-endpoint-identity",
              "java/framework-import-shadow",
              "java/framework-jpa-bean-identity",
              "java/implicit-object-equals",
              "java/implicit-object-methods",
              "java/jaxrs-method-vs-locator",
              "java/lombok-accessor-restrictions",
              "java/lombok-boolean-accessors",
              "java/spring-repository-redeclaration",
              "java/spring-requestmethod-identity",
          }
          actual_failures = set(re.findall(r"^FAIL\s+(java/[^\s]+)", content, re.MULTILINE))
          assert expected_failures <= actual_failures, f"regression controls not red: {sorted(expected_failures - actual_failures)}"
          assert java["fail"] >= len(expected_failures), f"new regressions did not go red on baseline: {java}"
          print("Regression sensitivity proved on baseline:", java, sorted(actual_failures))
          PY
          cp /tmp/bb-fixed-java-analyzer.ts src/ast/real-java-analyzer.ts
      - name: Java indexed SQLite store round-trip
        run: bun script/m14/java-store-e2e-smoke.ts
      - name: Prove SQLite regression catches the original indexer
        shell: bash
        run: |
          set -euo pipefail
          cp src/ast/parallel-indexer.ts /tmp/bb-java-fixed-indexer.ts
          git show 29a579243458490ff23d8de3f7f8f46aad120a43:src/ast/parallel-indexer.ts > src/ast/parallel-indexer.ts
          set +e
          bun script/m14/java-store-e2e-smoke.ts > /tmp/bb-java-sqlite-red.log 2>&1
          old_status=$?
          set -e
          cp /tmp/bb-java-fixed-indexer.ts src/ast/parallel-indexer.ts
          test "$old_status" -ne 0
          grep -Eq 'JAVA_SQLITE_E2E_FAIL: (two Java files x two import channels|file-level edges attached)' /tmp/bb-java-sqlite-red.log
          echo "JAVA_SQLITE_RED_CONTROL_PASS: original indexer fails the new database invariants"
      - name: Prove Java overload ambiguity guard against the original resolver
        shell: bash
        run: |
          set -euo pipefail
          cp src/ast/member-owner-resolution.ts /tmp/bb-java-fixed-owner-resolver.ts
          git show 29a579243458490ff23d8de3f7f8f46aad120a43:src/ast/member-owner-resolution.ts > src/ast/member-owner-resolution.ts
          set +e
          bun script/m14/java-store-e2e-smoke.ts > /tmp/bb-java-overload-red.log 2>&1
          old_status=$?
          set -e
          cp /tmp/bb-java-fixed-owner-resolver.ts src/ast/member-owner-resolution.ts
          test "$old_status" -ne 0
          grep -q 'JAVA_SQLITE_E2E_FAIL: overload confusion' /tmp/bb-java-overload-red.log
          echo "JAVA_OVERLOAD_RED_CONTROL_PASS: old resolver selects one of distinct Java overloads"
      - name: Java M12 differential — enforce recorded baseline without hiding failures
        shell: bash
        run: |
          set -euo pipefail
          rm -f validation/m12/results/java-differential.json
          set +e
          bun script/m12/verify-analyzer.ts java | tee m12-java.log
          differential_status=${PIPESTATUS[0]}
          set -e
          test -s validation/m12/results/java-differential.json
          DIFF_STATUS="$differential_status" python3 - <<'PY'
          import json, os, pathlib
          result = json.loads(pathlib.Path("validation/m12/results/java-differential.json").read_text())
          metrics = result["passing"]["metrics"]
          measured = {k:metrics[k] for k in ("truePositive","falsePositive","falseNegative","unknown")}
          baseline = {"truePositive":95,"falsePositive":105,"falseNegative":21,"unknown":6}
          assert measured == baseline, f"M12 Java metrics changed; independently adjudicate delta: {measured} != {baseline}"
          assert os.environ["DIFF_STATUS"] == "1", "M12 differential should report outstanding mismatches; investigate status change"
          assert not result["passing"]["passed"], "M12 known deficiencies unexpectedly reported passing"
          print("M12 Java unchanged from known failing baseline, NOT fully passing:", measured)
          PY
      - name: Classify Java M12 identity and oracle coverage differences without changing truth
        run: bun script/m14/java-m12-mismatch-census.ts | tee java-m12-census.log
      - name: Upload Java gate logs for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-semantic-gate-logs
          path: |
            java-fixtures.log
            m12-java.log
            java-m12-census.log
            validation/m12/results/java-differential.json
          if-no-files-found: warn
      - name: Independently compiled Java oracle facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bb-java-oracles
          javac -d /tmp/bb-java-oracles             validation/m14/verification/JavaMethodGenericOverrideOracle.java             validation/m14/verification/JavaAnalyzerRemediationOracle.java             validation/m14/verification/JavaAnalyzerSemanticOracle.java             validation/m14/verification/JavaM12CompilerAdjudication.java
          java -cp /tmp/bb-java-oracles JavaMethodGenericOverrideOracle             validation/m14/fixtures/java/override-unbounded-method-alpha-equivalence.java             validation/m14/fixtures/java/override-generic-method-return-consistency.java
          java -cp /tmp/bb-java-oracles JavaAnalyzerRemediationOracle
          java -cp /tmp/bb-java-oracles JavaAnalyzerSemanticOracle
          java -cp /tmp/bb-java-oracles JavaM12CompilerAdjudication validation/m12/fixtures/java
