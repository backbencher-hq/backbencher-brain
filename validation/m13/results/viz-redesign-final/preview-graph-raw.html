<style>

  :root{
    --bg:#08090c; --ink:#e9ecf2; --muted:#8b90a0; --faint:#6f7684;
    --line:rgba(255,255,255,.10); --panel:#14161c; --accent:#5eead4; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:12.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #stage{position:absolute;inset:0}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}
  /* Everything that floats over the canvas is ONE kind of thing, and there are four
     of them: where you look (search), what just happened (progress), what the frame
     holds (shown), and what you picked (detail). The census, the legend and the
     filters are NOT here — they belong to the sidebar, and this document no longer
     draws them. */
  .ov{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
  #search{top:14px;right:14px;padding:9px 11px;display:flex;gap:8px;align-items:center}
  #search input{background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:7px 10px;width:210px;outline:none;font:inherit}
  #search input:focus{border-color:var(--accent)}
  #qstat{color:var(--muted);font-size:11px;min-width:46px}
  #progress{left:50%;transform:translateX(-50%);top:14px;padding:6px 12px;color:var(--accent);
    font-size:11px;border-radius:999px;font-variant-numeric:tabular-nums}
  /* The overlays are OPAQUE: a translucent panel let canvas labels read through the
     search box, which looked like the box itself was wrong. */
  #shown{left:50%;transform:translateX(-50%);bottom:14px;padding:6px 12px;color:var(--muted);
    font-size:11px;border-radius:999px;font-variant-numeric:tabular-nums;max-width:72vw;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hint{left:50%;transform:translateX(-50%);bottom:44px;padding:6px 12px;color:var(--muted);
    font-size:11px;border-radius:999px;max-width:72vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.detail-open #hint{opacity:0;pointer-events:none}
  #hint{transition:opacity .45s ease}
  #hint.gone{opacity:0;pointer-events:none}
  /* The relationship box: dockable to either side, collapsible to its own heading.
     MEASURED in the reader's report of this artifact: the box had one control, an X in
     one fixed corner, and that X also cleared the selection -- so getting the panel out
     of the way cost the reader the focus and the zoom they had just asked for. Three
     controls now, because they are three different intentions. */
  #detail{right:14px;bottom:14px;padding:11px 11px 11px;max-width:380px;max-height:46vh;overflow:auto;display:none;border-radius:12px;
    transition:max-width .2s ease,opacity .2s ease}
  #detail.on{display:block}
  #detail.dock-right{left:auto;right:14px}
  #detail.dock-left{left:14px;right:auto}
  #detail.collapsed{padding:7px 10px;max-width:none;overflow:hidden}
  #detail.collapsed #dbody{display:none}
  #dhead{display:flex;align-items:center;gap:8px;cursor:grab}
  #dhead.dragging{cursor:grabbing}
  #dtitle{flex:1;min-width:0;font-size:11.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #detail.collapsed #dtitle{color:var(--muted)}
  .ctls{display:flex;align-items:center;gap:1px;flex:none}
  .ctl{background:none;border:0;font:inherit;font-size:12px;line-height:1;color:var(--muted);cursor:pointer;padding:3px 6px;border-radius:6px}
  .ctl:hover{color:var(--accent);background:rgba(255,255,255,.07)}
  .ctl:focus-visible{outline:1px solid var(--accent)}
  #detail h3{margin:2px 0 7px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  #detail dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-variant-numeric:tabular-nums}
  #detail dt{color:var(--muted)} #detail dd{margin:0;word-break:break-all}
  @media (max-width:760px){#hint{display:none}#search input{width:150px}}

</style>
</head>

</div>

    // rebuilt lazily on the next frame that asks for it.
    grid = null;

      var bx = Math.min(gW - 1, Math.max(0, Math.floor((Math.max(a.x, b.x) - gOX) / pitch)));
      var ay = Math.min(gH - 1, Math.max(0, Math.floor((Math.min(a.y, b.y) - gOY) / pitch)));
      var by2 = Math.min(gH - 1, Math.max(0, Math.floor((Math.max(a.y, b.y) - gOY) / pitch)));

    var ay = Math.min(gH - 1, Math.max(0, Math.floor((v.y0 - gOY) / cellSize)));

  function focusSet() {

  function drawModuleRegions() {

    // node is a click on a node, and a click on the line between two regions is a
    // question about the regions, not about whichever stored edge is nearest.
    if (lastBundles.length) {
      var lpick = null, lbd = 9;
      for (var lbi = 0; lbi < lastBundles.length; lbi++) {
        var lbu = lastBundles[lbi], lca = lastCent[lbu.a], lcb = lastCent[lbu.b];
        if (!lca || !lcb) continue;
        var ld = distSeg(cx, cy, lca, lcb);
        if (ld < lbd) { lbd = ld; lpick = lbu; }
      }
      if (lpick) return lpick;
    }
    var el = vis.e, ebest = null, ebd = 7;
    for (var j = 0; el && j < el.length; j++) {
      var l = L[el[j]], a = byId[l.source], b = byId[l.target];
      if (!a || !b || edgeHidden(l)) continue;
      var p1 = toScreen(a.x, a.y), p2 = toScreen(b.x, b.y);
      var d2 = distSeg(cx, cy, p1, p2);
      if (d2 < ebd) { ebd = d2; ebest = l; }
    }
    return ebest;
  }
  function distSeg(px, py, a, b) {
    var vx = b[0] - a[0], vy = b[1] - a[1], wx = px - a[0], wy = py - a[1];
    var L2 = vx * vx + vy * vy;
    var t = L2 ? Math.max(0, Math.min(1, (wx * vx + wy * vy) / L2)) : 0;
    return Math.hypot(px - (a[0] + t * vx), py - (a[1] + t * vy));
  }

  var det = document.getElementById("detail"), dbody = document.getElementById("dbody");
  // The view no longer ships fit/save BUTTONS: those live in the sidebar, and every
  // control in one place is the point of this pass. The behaviour stays here and is
  // published below, so the shell calls the same code the buttons used to call.
  function saveSelf(name) {
    try {
      var blob = new Blob(["<!DOCTYPE html>" + String.fromCharCode(10) + document.documentElement.outerHTML], { type: "text/html" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return true;
    } catch (e) { return false; }
  }
  // ── the relationship box: three controls, three intentions ───────────────────
  //
  // MEASURED in the reader's report: the X was the only exit from this panel AND it ran
  // "sel = null", so a reader who hid the box to see the whole picture lost the focus
  // and the zoom they had just asked for. Hiding a panel is not clearing a selection.
  // Collapsing keeps the selection and narrows the box to its own heading; the heading
  // always names what is picked, so a collapsed panel is never a panel you have to
  // reopen to remember; X clears; and the box docks to either side (by its control, or
  // by dragging its heading across the middle of the frame).
  var dtitleEl = document.getElementById("dtitle");
  var collapseEl = document.getElementById("dcollapse");
  var moveEl = document.getElementById("dmove");
  function panelState() {
    return { collapsed: panelCollapsed, dock: dock, visible: det.classList.contains("on"),
             title: dtitleEl ? dtitleEl.textContent : "" };
  }
  function applyPanel() {
    det.classList.toggle("collapsed", panelCollapsed);
    det.classList.toggle("dock-left", dock === "left");
    det.classList.toggle("dock-right", dock === "right");
    if (collapseEl) {
      collapseEl.innerHTML = panelCollapsed ? "&#9652;" : "&#9662;";
      collapseEl.setAttribute("title", panelCollapsed ? "expand this panel (the selection stays)" : "collapse this panel and keep the selection");
      collapseEl.setAttribute("aria-expanded", panelCollapsed ? "false" : "true");
    }
    if (moveEl) moveEl.setAttribute("title", "move this panel to the " + (dock === "left" ? "right" : "left") + " side");
  }
  function setPanel(opts) {
    if (opts && opts.collapsed != null) panelCollapsed = !!opts.collapsed;
    if (opts && (opts.dock === "left" || opts.dock === "right")) dock = opts.dock;
    applyPanel();
    return panelState();
  }
  if (collapseEl) collapseEl.onclick = function () { setPanel({ collapsed: !panelCollapsed }); };
  if (moveEl) moveEl.onclick = function () { setPanel({ dock: dock === "left" ? "right" : "left" }); };
  (function () {
    var head = document.getElementById("dhead");
    if (!head) return;
    var from = null;
    head.addEventListener("mousedown", function (ev) {
      if (ev.target && ev.target.className && String(ev.target.className).indexOf("ctl") >= 0) return;
      ev.preventDefault();
      from = { x: ev.clientX, y: ev.clientY, last: dock };
      head.classList.add("dragging");
    });
    window.addEventListener("mouseup", function (ev) {
      if (!from) return;
      var start = from;
      from = null;
      head.classList.remove("dragging");
      if (Math.abs(ev.clientX - start.x) > 40) setPanel({ dock: ev.clientX < window.innerWidth / 2 ? "left" : "right" });
      // A click, not a drag: on a collapsed panel that is the reader asking for the box
      // back, and on an open one it does nothing -- the heading is a handle, not a
      // second X.
      else if (panelCollapsed) setPanel({ collapsed: false });
    });
  }());
  applyPanel();
  document.getElementById("dclose").onclick = function () { det.classList.remove("on"); document.body.classList.remove("detail-open"); sel = null; draw(); };
  /** What the box is about, in one line: the heading, and the whole text of the
   *  collapsed panel. A collapsed panel that cannot say what it is hiding is a panel
   *  the reader has to reopen to remember what they picked. */
  function summaryOf(o) {
    if (!o) return "nothing picked";
    if (o.kind === "regionLink") return o.a + " \u2194 " + o.b + " \u00b7 " + o.count + (o.count === 1 ? " edge" : " edges");
    if (o.name !== undefined) return o.name + " \u00b7 " + (o.type || "symbol") + " \u00b7 " + (o.filePath || "unknown file") + (o.line != null ? ":" + o.line : "");
    var sN = byId[o.source], tN = byId[o.target];
    return (sN ? (sN.name || sN.id) : o.source) + " \u2192 " + (tN ? (tN.name || tN.id) : o.target) + " \u00b7 " + (o.type || "edge");
  }
  function show(o) {
    if (!o) { det.classList.remove("on"); document.body.classList.remove("detail-open"); return; }
    var isLink = o.kind === "regionLink";
    var isNode = o.name !== undefined;
    var rows = isLink
      ? [["regions", o.a + "  \u2194  " + o.b], ["cross-region edges in this link", o.count + (o.count === 1 ? " edge" : " edges")],
         ["stored rows behind them", o.rows], ["commonest relationship", o.dominantRelationship || o.type],
         ["heaviest member", o.heaviest], ["this link is a summary", "zoom in, or double-click the link, for the individual edges"]]
      : isNode
      ? [["name", o.name], ["type", o.type], ["language", o.group], ["file", o.filePath],
         ["line", o.line != null ? o.line + (o.lineEnd ? "-" + o.lineEnd : "") : "unknown"],
         ["qualified name", o.qualifiedName || "—"], ["gravity", o.gravity != null ? o.gravity : "—"],
         ["stale", o.stale ? "yes — file changed since index" : "no"]]
      : [["from", (byId[o.source] || {}).name || o.source], ["to", (byId[o.target] || {}).name || o.target],
         ["type", o.type], ["confidence", o.confidence != null ? o.confidence : "unknown"],
         ["line", o.line != null ? o.line : "unknown"],
         ["language", o.crossLanguage ? (o.bridge || "crosses a language boundary") : "within one language"],
         ["stored rows", o.occurrences ? (o.occurrences + (o.occurrences === 1 ? " row" : " rows")) : "unknown"],
         ["first row", o.rowId || "—"],
         ["all rows", o.rowIds && o.rowIds.length > 1 ? o.rowIds.length + " carried" : "—"],
         ["owner cascade", o.ownerCascade ? "yes — folded from a stored member row, attributed to this owner" : "no"],
         ["matched member(s)", o.matchedMembers && o.matchedMembers.length ? o.matchedMembers.join(", ") : "—"],
         ["stale", o.stale ? "yes" : "no"]];
    dbody.innerHTML = "<h3>" + (isLink ? "Region link" : isNode ? "Symbol" : "Relationship") + "</h3><dl>" +
      rows.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("") + "</dl>";
    if (dtitleEl) dtitleEl.textContent = summaryOf(o);
    det.classList.add("on");
    document.body.classList.add("detail-open");
    applyPanel();
    notify();
  }

  var input = document.getElementById("q"), qstat = document.getElementById("qstat");
  input.addEventListener("input", function () {
    q = input.value; var v = q.toLowerCase();
    var hits = v ? N.filter(function (n) { return (n.name || "").toLowerCase().indexOf(v) >= 0; }).length : 0;
    qstat.textContent = v ? hits + " match" + (hits === 1 ? "" : "es") : "";
    draw();
    notify();
  });

  // ---- filters.
  //
  // Hiding is a DISPLAY decision: nothing leaves the data, the census keeps every
  // row, and the downloads carry every node and edge. A filter that silently drops
  // rows from the answer would be the same lie this file was fixed for twice.
  // The state itself is declared with the renderer's other state, at the top.
  function nodeHidden(nd) { return !!nd && (!!hiddenKinds[nd.type] || !!hiddenGroups[nd.group] || (!!hiddenFlags.isolated && !NODE_DEG[nd.id]) || !!hiddenModules[nd.module]); }
  function edgeHidden(l) { return !!hiddenTypes[l.type] || nodeHidden(byId[l.source]) || nodeHidden(byId[l.target]); }
  function filteredNodes() { var n = 0; for (var i = 0; i < N.length; i++) if (!nodeHidden(N[i])) n++; return n; }
  function filteredEdges() { var n = 0; for (var i = 0; i < L.length; i++) if (!edgeHidden(L[i])) n++; return n; }
  function toggleInto(map, key, show) { if (show) delete map[key]; else map[key] = 1; }
  function filterOptions() {
    var groups = {};
    for (var i = 0; i < N.length; i++) groups[N[i].group] = (groups[N[i].group] || 0) + 1;
    var kinds = {};
    for (var k = 0; k < N.length; k++) kinds[N[k].type] = (kinds[N[k].type] || 0) + 1;
    var out = [
      { id: "types", label: "Relationship types",
        options: types.map(function (t) { return { value: t, count: byType[t] || 0, color: col(t), dash: STRUCTURAL[t] ? "solid" : "dashed" }; }),
        hidden: function (v) { return !!hiddenTypes[v]; },
        set: function (v, show) { toggleInto(hiddenTypes, v, show); changed(); } },
      { id: "languages", label: "Languages",
        options: Object.keys(groups).sort().map(function (g) { return { value: g, count: groups[g], color: langColor(g) }; }),
        hidden: function (v) { return !!hiddenGroups[v]; },
        set: function (v, show) { toggleInto(hiddenGroups, v, show); changed(); } },
      { id: "kinds", label: "Symbol kinds",
        options: Object.keys(kinds).sort().map(function (t) { return { value: t, count: kinds[t] }; }),
        hidden: function (v) { return !!hiddenKinds[v]; },
        set: function (v, show) { toggleInto(hiddenKinds, v, show); changed(); } },
      // The regions are the map's own vocabulary now, so they get a control too: a
      // module the reader is not working on can be turned off without a scope change.
      { id: "modules", label: "Modules",
        options: MODULES.map(function (m) { return { value: m, count: (MODULE_MEMBERS[m] || []).length }; }),
        hidden: function (v) { return !!hiddenModules[v]; },
        set: function (v, show) { toggleInto(hiddenModules, v, show); changed(); } }
    ];
    if (isolatedCount > 0) out.push({ id: "connectivity", label: "Connectivity",
      options: [{ value: "isolated", count: isolatedCount }],
      hidden: function (v) { return !!hiddenFlags[v]; },
      set: function (v, show) { toggleInto(hiddenFlags, v, show); changed(); } });
    return out;
  }
  /** The region links this frame is drawing, and where they run on screen.
   *
   *  The overview draws a summary instead of every cross-region edge, and a summary that
   *  can only be SEEN is a summary that cannot be checked. This is the same list the
   *  canvas strokes, with each link's midpoint in canvas coordinates, so the sentence in
   *  the readout has data behind it. */
  function regionLinks() {
    var out = [];
    for (var li = 0; li < lastBundles.length; li++) {
      var lb = lastBundles[li], lc = lastCent[lb.a], ld = lastCent[lb.b];
      if (!lc || !ld) continue;
      out.push({
        key: lb.key, a: lb.a, b: lb.b,
        count: lb.count, rows: lb.rows,
        type: lb.dominantRelationship || lb.type, heaviest: lb.heaviest,
        from: { x: lc[0], y: lc[1] }, to: { x: ld[0], y: ld[1] },
        mid: { x: (lc[0] + ld[0]) / 2, y: (lc[1] + ld[1]) / 2 },
      });
    }
    return out;
  }
  function viewState() {
    return { visibleNodes: filteredNodes(), totalNodes: N.length, visibleEdges: filteredEdges(), totalEdges: L.length,
             // The summary, so the sidebar's live line can say that the canvas is
             // drawing region links rather than the individual cross-region edges.
             regionLinks: lastBundles.length, linkPairs: lastPairs, crossRegionEdgesOnFrame: lastCross,
             zoom: view.k,
             // A selected link names the two regions, because "regionLink" is the kind of
             // thing it is and not the answer to "what did I just pick".
             selected: sel ? (sel.name || (sel.kind === "regionLink" ? sel.a + " to " + sel.b : null) || sel.type || null) : null,
             // Which layout is on screen and where the relationship box is, so the sidebar
             // (or a reader checking the picture) can read both rather than infer them.
             layout: LAYOUT, panel: panelState(), onScreen: onScreenRows() };
  }
  function notify() { /* the shell polls state(); a cross-frame event would be redundant */ }
  function changed() { grid = null; draw(); if (!userMoved) fitAll(); notify(); }
  /** The rows the sidebar's On screen line prints, in THIS view's own words.
   *
   * MEASURED in the sidebar's own source and in the browser gate: this sentence used to be
   * composed by the SHELL, out of st.visibleNodes / st.visibleEdges / st.regionLinks -- so
   * the mount had to know what a region link is, and a view mounted in place of the graph
   * would have been described in the graph's vocabulary and its own counts. It does not
   * have to: the view publishes the rows it wants printed and the shell prints them, which
   * is the same division of labour the census already uses.
   */
  function onScreenRows() {
    var shownNodes = filteredNodes(), shownEdges = filteredEdges();
    var out = [row("nodes", shownNodes + " of " + N.length), row("edges", shownEdges + " of " + L.length)];
    var hidden = (N.length - shownNodes) + (L.length - shownEdges);
    if (hidden > 0) out.push({ label: "", value: hidden + " hidden by filters", warn: true });
    // The overview draws a REGION LINK per region pair rather than each cross-region edge,
    // so this line and the ~40 lines on the canvas would otherwise contradict each other.
    // MEASURED in the artifact: the sidebar is where a reader checks what is on screen, so
    // the reconciliation belongs here and not only in the frame's own readout.
    if (lastBundles.length > 0) {
      out.push({ label: "edges on screen", tone: "plain", value: lastBundles.length + (lastBundles.length === 1 ? " region link stands" : " region links stand") +
        " for " + lastCross + " cross-region edges" + (lastPairs > lastBundles.length ? " (heaviest " + lastBundles.length + " of " + lastPairs + " pairs)" : "") });
    }
    out.push(row("layout", LAYOUT));
    // A selected link names the two regions, because "regionLink" is the kind of thing it
    // is and not the answer to "what did I just pick".
    var name = sel ? (sel.name || (sel.kind === "regionLink" ? sel.a + " to " + sel.b : null) || sel.type || null) : null;
    if (name) out.push(row("selected", name));
    return out;
  }
  window.__bbView = {
    kind: "graph",
    title: "Architecture Map",
    subtitle: "bb_visualize \u00b7 self-contained \u00b7 no network",
    census: censusRows,
    note: excludedNote,
    legend: legendRows,
    encoding: encodingRows,
    filters: filterOptions,
    state: viewState,
    hint: "drag to pan · scroll to zoom · click a node to focus, an edge to frame both ends, double-click a node to fill the view with its neighbours",
    links: regionLinks,
    // The layouts this document can draw, and which one is on screen. Published so the
    // sidebar can offer the choice -- and so the choice can be CHECKED, rather than
    // inferred from what the pixels happen to look like.
    layouts: function () { return [
      { value: "regions", label: "Regions", hint: "group symbols into the directory they live in: named pods, and one dotted region link per region pair at the overview" },
      { value: "force", label: "Force", hint: "no directories: one force layout, no pods and no region links, every edge drawn as itself" }
    ]; },
    layout: function () { return LAYOUT; },
    setLayout: function (next) {
      var mode = next === "force" ? "force" : "regions";
      if (mode === LAYOUT) return LAYOUT;
      LAYOUT = mode;
      document.documentElement.setAttribute("data-bb-layout", LAYOUT);
      // A picked region link does not exist in the other layout: drop the pick rather
      // than keep a panel open about a line that is no longer on the screen.
      sel = null; hover = null; selLinkKey = null; hoverLinkKey = null;
      show(null);
      restartLayout();
      return LAYOUT;
    },
    // Where the box sits and whether it is collapsed: the reader's state, published for
    // the same reason the links are -- a state that can only be seen cannot be checked.
    panel: panelState,
    setPanel: setPanel,
    data: function () { return G; },
    fit: function () { fitAll(); },
    reset: function () { hiddenTypes = {}; hiddenGroups = {}; hiddenKinds = {}; hiddenFlags = {}; hiddenModules = {}; selLinkKey = null; hoverLinkKey = null; changed(); },
    saveHtml: function () { return saveSelf("bb-architecture-map.html"); }
  };
  // The grid and the adjacency table need settled positions, so they are built
  // once the layout reports done and rebuilt if it is still running when the first
  // frame is painted.
  buildAdjacency();
  function ensureIndexes() { if (!grid) buildGrid(); }
  if (lay && lay.done()) ensureIndexes();
  else if (progressEl) {
    var waited = 0;
    var idxTimer = setInterval(function () {
      waited += 120;
      if (!lay || lay.done()) { ensureIndexes(); clearInterval(idxTimer) }
      else if (waited > 30000) { ensureIndexes(); clearInterval(idxTimer) }
    }, 120);
  }
  window.addEventListener("resize", function () { resize(); if (!userMoved) fitAll(); else draw(); notify(); });
  resize(); draw();
  notify();
  if (N.length === 0) {
    var emptyEl = document.getElementById("shown");
    if (emptyEl) { emptyEl.style.display = "block"; emptyEl.textContent = "no nodes in this slice"; }
  }
})();

</script>
</body>
</html>
