bject.keys(langs).sort().map(function (g) { return { value: g, count: langs[g], color: langColour(g) } }),\n        hidden: function (v) { return !!hiddenLangs[v] },\n        set: function (v, show) { toggleInto(hiddenLangs, v, show) } },\n    ]\n  }\n  /** A filter change redraws and NOTHING ELSE moves.\n   *\n   *  MEASURED on the graph view, and kept here deliberately: the files keep their cells and\n   *  the treemap's geometry does not depend on what is muted, so re-fitting on a filter\n   *  toggle would throw a reader who had zoomed into one file back out to the whole map. The\n   *  map is only re-framed when the arrangement itself changes -- see setLayout below. */\n  function changed() { draw(); notify() }\n  function notify() { /* the mount polls state(); a cross-frame event would be redundant */ }\n  function publishSearch() {\n    var el = document.getElementById(\"qstat\")\n    if (!el) return\n    el.textContent = q ? last.hits + \" match\" + (last.hits === 1 ? \"\" : \"es\") : \"\"\n  }\n  function symById() {\n    if (!SYM_IDX) { SYM_IDX = {}; for (var i = 0; i \u003c S.length; i++) SYM_IDX[S[i].id] = S[i] }\n    return SYM_IDX\n  }\n  function detailVisible() { var d = document.getElementById(\"detail\"); return !!d && d.classList.contains(\"on\") }\n  function panelState() {\n    return { collapsed: panelCollapsed, visible: detailVisible(), title: dtitleEl ? dtitleEl.textContent : \"\" }\n  }\n  function selectedName() {\n    if (!sel) return null\n    if (sel.kind === \"file\") return sel.path\n    var s = symById()[sel.id]\n    return s ? (s.name || sel.id) : sel.id\n  }\n  /** The rows the sidebar's \"On screen\" line prints, in THIS view's own vocabulary.\n   *\n   *  MEASURED while building this pass: the shell composed that line from\n   *  visibleNodes/totalNodes and edges -- the GRAPH's words -- so a mounted code map would\n   *  have reported \"nodes 1412 of 1412 · edges 0 of 0\": a sentence about a different\n   *  picture, in a vocabulary this view does not have. The view publishes the rows and the\n   *  shell prints them, which is the same division of labour as the census. */\n  function onScreenRows() {\n    var out = [\n      row(\"symbols\", (last.syms - last.muted) + \" of \" + last.syms),\n      row(\"files\", last.files + \" in \" + last.groups + \" \" + groupUnit()),\n    ]\n    // WHAT THE FRAME COULD NOT DRAW ONE-TO-ONE, said in the same breath as what it drew.\n    // MEASURED before this pass: over src/, 1,633 of 3,232 stripes were under one device\n    // pixel tall and nothing anywhere in the artifact said so -- the census counted symbols\n    // the frame was painting as a smear. A fold count is published only when something IS\n    // folded, because a readout about a mark the picture does not contain is the defect the\n    // muted row was already fixed for.\n    out.push(row(\"stripe detail\", last.foldedSyms\n      ? last.foldedSyms + \" of \" + last.syms + \" folded · \" + last.mixFiles + \" file(s) as one composition strip (zoom in)\"\n      : \"every symbol drawn on its own\", !!last.foldedSyms))\n    out.push(row(\"names\", last.namedFiles + \" files · \" + last.namedSymbols + \" symbols\" +\n      (last.unnamedSmall ? \" · \" + last.unnamedSmall + \" with no room for a name\" : \"\"),\n      !!(last.unnamedSmall || last.unnamedBudget)))\n    if (last.muted) out.push({ label: \"\", value: last.muted + \" muted by a filter\", warn: true })\n    if (last.hits) out.push(row(\"matches\", last.hits))\n    out.push(row(\"zoom\", Math.round(view.k * 100) + \"%\"))\n    var name = selectedName()\n    if (name) out.push(row(\"selected\", name))\n    return out\n  }\n  function viewState() {\n    return {\n      visibleSymbols: last.syms - last.muted, totalSymbols: last.syms, mutedSymbols: last.muted,\n      visibleFiles: last.files, totalFiles: last.files, groups: last.groups, zoom: view.k,\n      groupBy: groupBy, search: q, selected: selectedName(),\n      layout: groupBy, panel: panelState(), onScreen: onScreenRows(),\n      // What the frame drew one-to-one and what it folded, so a gate (and the graph's own view\n      // of itself) can read the level of detail rather than infer it from a screenshot.\n      lod: {\n        minStripePx: MIN_STRIPE_PX, zoom: view.k, bucket: lodBucket(),\n        stripesDrawn: last.stripes, gapBands: last.gaps, drawnElements: last.stripes + last.gaps + last.mixFiles,\n        foldedSymbols: last.foldedSyms, foldedFiles: last.foldedFiles, compositionStrips: last.mixFiles,\n        named: last.named, namedFiles: last.namedFiles, namedSymbols: last.namedSymbols,\n        unnamedSmall: last.unnamedSmall, unnamedBudget: last.unnamedBudget,\n      },\n    }\n  }\n  /** The data port: what the picture was drawn from, in the shape the sidebar's downloads\n   *  already speak.\n   *\n   *  The nodes carry the projection's own field names, because that is what every other\n   *  consumer of a node in this tool reads -- `group` is the language and `type` the kind.\n   *  This view draws no edges, and says so with an EMPTY list rather than by omitting the\n   *  key, so the mount can disable the edges download instead of handing out a CSV of\n   *  nothing. Muted items stay in the port: a filter is a display decision. */\n  var DATA = null\n  function dataPort() {\n    if (DATA) return DATA\n    var nodes = []\n    for (var i = 0; i \u003c S.length; i++) {\n      var s = S[i]\n      nodes.push({\n        id: s.id, name: s.name, type: s.type || \"unknown\", group: String(s.group || s.language || \"unknown\"),\n        filePath: s.filePath, line: s.line, lineEnd: s.lineEnd, qualifiedName: s.qualifiedName,\n        gravity: s.gravity, stale: s.stale === true, lines: spanOf(s),\n        muted: !!(hiddenKinds[s.type || \"unknown\"] || hiddenLangs[String(s.group || s.language || \"unknown\")]),\n      })\n    }\n    DATA = {\n      view: \"codemap\", scope: G.scope, target: G.target, nodes: nodes, links: [],\n      symbols: S, excluded: G.excluded, totalNodesAvailable: G.totalNodesAvailable, shownNodes: G.shownNodes,\n    }\n    return DATA\n  }\n\n  // ---- interaction: hover, click, drill in\n  function boxAt(cx, cy) {\n    for (var i = boxes.length - 1; i >= 0; i--) {\n      var b = boxes[i]\n      var r = b.el.getBoundingClientRect()\n      if (cx >= r.left && cx \u003c= r.right && cy >= r.top && cy \u003c= r.bottom) return b\n    }\n    return null\n  }\n  /** Which SYMBOL of a folded strip a point lands on: the slice the strip's own gradient\n   *  draws under that point, so the pick and the picture cannot disagree. MEASURED need: a\n   *  strip can stand for a whole file's worth of definitions, and answering every click on it\n   *  with the run's FIRST symbol would make a reader's pick depend on the order the index\n   *  happened to return rather than on where they aimed. */\n  function resolveRun(b, cy) {\n    if (!b.run || b.run.length \u003c 2) return b\n    var r = b.el.getBoundingClientRect()\n    if (!r.height) return b\n    var t = (cy - r.top) / r.height\n    if (!(t >= 0)) t = 0\n    if (t > 0.9999) t = 0.9999\n    var at = t * (b.runLines || 1)\n    for (var i = 0; i \u003c b.run.length; i++) {\n      if (at \u003c b.run[i].cum) {\n        return { kind: \"sym\", id: b.run[i].sym.id, el: b.el, sym: b.run[i].sym, file: b.file, run: b.run, runLines: b.runLines }\n      }\n    }\n    var lastRef = b.run[b.run.length - 1]\n    return { kind: \"sym\", id: lastRef.sym.id, el: b.el, sym: lastRef.sym, file: b.file, run: b.run, runLines: b.runLines }\n  }\n  // ── the pick is the MAP's, not the document's ─────────────────────────────────\n  //\n  // Both listeners were on `document`, so every click anywhere in the page was read as a\n  // click on the map -- including a click on this document's own overlays, which is how it\n  // was found. MEASURED in a real browser (script/m13/verify-visualize-browser.ts, V10): the X\n  // cleared the selection and then the same click, bubbling on to `document`, picked whatever\n  // band lay under the panel and put the box straight back with the OLD subject on it -- so\n  // the one control that exists to clear a pick could not clear one. Typing in the search box\n  // had the same effect, and hovering the box re-picked what was under it. The graph view is\n  // immune because its canvas listener never sees a click on a DOM overlay above it; here the\n  // listener belongs to the MAP for the same reason.\n  map.addEventListener(\"mousemove\", function (ev) {\n    var b = boxAt(ev.clientX, ev.clientY)\n    if (b === hover) return\n    if (hover && hover.el) hover.el.style.cursor = \"\"\n    hover = b\n    if (b) { b.el.style.cursor = \"pointer\"; show(resolveRun(b, ev.clientY)) }\n  })\n  map.addEventListener(\"click\", function (ev) {\n    var b = boxAt(ev.clientX, ev.clientY)\n    if (!b) { sel = null; hide(); draw(); return }\n    if (b.kind === \"sym\") { var rb = resolveRun(b, ev.clientY); sel = { kind: \"sym\", id: rb.sym.id }; show(rb) }\n    else { sel = { kind: \"file\", path: b.file.path }; show(b) }\n    draw()\n  })\n  // ── the picked-item box: two controls, two different intentions ────────────────\n  //\n  // MEASURED on the graph view and fixed here before it was ever reported rather than\n  // after: the X was the only exit from this panel AND it cleared the selection, so getting\n  // the box out of the way to see the whole picture cost the reader the pick and the zoom\n  // they had just asked for. Hiding a panel is not clearing a selection. The collapse keeps\n  // the selection and narrows the box to its own heading, and the heading always names what\n  // is picked, so a collapsed panel never has to be reopened to remember.\n  var dtitleEl = document.getElementById(\"dtitle\")\n  var collapseEl = document.getElementById(\"dcollapse\")\n  function applyPanel() {\n    var det = document.getElementById(\"detail\")\n    det.classList.toggle(\"collapsed\", panelCollapsed)\n    if (!collapseEl) return\n    collapseEl.innerHTML = panelCollapsed ? \"&#9652;\" : \"&#9662;\"\n    collapseEl.setAttribute(\"aria-expanded\", panelCollapsed ? \"false\" : \"true\")\n    collapseEl.setAttribute(\"title\", panelCollapsed ? \"expand this panel (the selection stays)\" : \"collapse this panel and keep the selection\")\n  }\n  function setPanel(opts) {\n    if (opts && opts.collapsed != null) panelCollapsed = !!opts.collapsed\n    applyPanel()\n    return panelState()\n  }\n  if (collapseEl) collapseEl.onclick = function () { setPanel({ collapsed: !panelCollapsed }) }\n  applyPanel()\n  document.getElementById(\"dclose\").onclick = function () { hide(); sel = null; draw(); notify() }\n  function hide() {\n    document.getElementById(\"detail\").classList.remove(\"on\")\n    document.body.classList.remove(\"detail-open\")\n  }\n  /** What the box is about, in one line: this heading IS the collapsed panel. */\n  function summaryOf(b) {\n    if (!b) return \"nothing picked\"\n    if (b.kind === \"sym\") {\n      var s = b.sym\n      return (s.name || s.id) + \" · \" + (s.type || \"symbol\") + \" · \" + (s.filePath || \"unknown file\") +\n        (s.line != null ? \":\" + s.line : \"\")\n    }\n    return b.file.path + \" · \" + b.file.syms.length + (b.file.syms.length === 1 ? \" symbol\" : \" symbols\")\n  }\n  function show(b) {\n    var det = document.getElementById(\"detail\"), body = document.getElementById(\"dbody\")\n    if (!b) { hide(); return }\n    var rows, heading\n    if (b.kind === \"sym\") {\n      var s = b.sym\n      heading = \"Symbol\"\n      // The language comes from the same field the grouping reads, so the box and the map\n      // can never name two different languages for one symbol.\n      rows = [[\"name\", s.name], [\"kind\", s.type], [\"language\", String(s.group || s.language || \"unknown\")],\n              [\"file\", s.filePath], [\"lines\", (s.line || \"?\") + (s.lineEnd ? \"-\" + s.lineEnd : \"\")],\n              [\"lines spanned\", s._span], [\"qualified name\", s.qualifiedName || \"—\"],\n              [\"gravity\", s.gravity != null ? s.gravity : \"—\"],\n              [\"stale\", s.stale ? \"yes — file changed since index\" : \"no\"]]\n      // A symbol inside a folded strip IS drawn, as a slice of that strip, and the box says\n      // so: a reader who picks one should not have to wonder why its own band is missing.\n      if (b.run && b.run.length > 1) rows.push([\"drawn as\", \"one slice of a strip for \" + b.run.length + \" symbols — they fall under \" + MIN_STRIPE_PX + \"px at this zoom\"])\n      if (b.run && b.run.length === 1) rows.push([\"drawn as\", \"its own band, at the shortest size that still renders\"])\n    } else {\n      heading = \"File\"\n      rows = [[\"file\", b.file.path], [\"language\", b.file.lang], [\"symbols\", b.file.syms.length],\n              [\"lines spanned\", b.file.lines], [\"last line\", b.file.maxLine]]\n    }\n    body.innerHTML = \"\u003ch3>\" + heading + \"\u003c/h3>\u003cdl>\" +\n      rows.map(function (r) { return \"\u003cdt>\" + esc(r[0]) + \"\u003c/dt>\u003cdd>\" + esc(r[1]) + \"\u003c/dd>\" }).join(\"\") + \"\u003c/dl>\"\n    if (dtitleEl) dtitleEl.textContent = summaryOf(b)\n    det.classList.add(\"on\")\n    document.body.classList.add(\"detail-open\")\n    applyPanel()\n    notify()\n  }\n\n  // The arrangement is the sidebar's Layout section now, so there are no group-by buttons\n  // here: the mount calls setLayout on the API below, which is the same code these used to\n  // run. `sel` deliberately survives it -- the files are the same files, only the cells move.\n  var input = document.getElementById(\"q\")\n  input.addEventListener(\"input\", function () { q = input.value; draw(); notify() })\n  // ---- zoom, pan, and the two ways out\n  //\n  // Wheel zooms about the CURSOR, not about the centre of the viewport, because the\n  // point under the cursor is the point the reader is looking at; zooming about the\n  // centre slides whatever they were examining out from under them. Drag pans.\n  //\n  // The gesture that ENDS the interaction is as important as the one that starts it:\n  // double-click frames a single file, which is the \"show me this part\" move that a\n  // 1,400-symbol map otherwise has no answer for. Without it, zooming is a one-way\n  // trip into a picture with no way back.\n  // The instruction line is a FIRST-RUN hint, not a permanent banner. The composed viewer\n  // prints the same sentence in its own View section (published as `hint`), so a pill that\n  // never went away would be chrome lying over the drawing -- which is the defect this pass\n  // exists to remove. The first gesture retires it, and so does a timeout, so a reader who\n  // never touches the map is not left with it forever either.\n  var hintEl = document.getElementById(\"zoomhint\"), hintGone = false\n  function dismissHint() { if (!hintGone && hintEl) { hintEl.classList.add(\"gone\"); hintGone = true } }\n  setTimeout(dismissHint, 6000)\n  map.addEventListener(\"wheel\", function (ev) {\n    ev.preventDefault()\n    dismissHint()\n    zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * 0.0016))\n  }, { passive: false })\n  var drag = null\n  map.addEventListener(\"mousedown\", function (ev) {\n    dismissHint()\n    drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false }\n    map.classList.add(\"panning\")\n  })\n  window.addEventListener(\"mousemove\", function (ev) {\n    if (!drag) return\n    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y\n    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true\n    view.x = drag.vx + dx; view.y = drag.vy + dy\n    applyView(document.getElementById(\"world\"))\n    reportView()\n  })\n  window.addEventListener(\"mouseup\", function () {\n    map.classList.remove(\"panning\")\n    drag = null\n  })\n  map.addEventListener(\"dblclick\", function (ev) {\n    var fkey = null\n    if (ev.target && ev.target.dataset && ev.target.dataset.fkey) fkey = ev.target.dataset.fkey\n    if (fkey) frameFile(fkey)\n    else fitWorld()\n  })\n  /** Zoom so one file fills the viewport, keeping its aspect. */\n  function frameFile(path) {\n    var el = document.querySelector('[data-file=\"' + path.replace(/\"/g, '\\\\\"') + '\"]')\n    if (!el) return fitWorld()\n    var r = map.getBoundingClientRect()\n    var box = el.getBoundingClientRect()\n    if (!box.width || !box.height) return fitWorld()\n    // The element's rect is ALREADY in viewport pixels, so it has to be taken BACK\n    // through the transform before it can be re-centred under a new one. Treating the\n    // viewport-space centre as if it were a world coordinate centred the view on\n    // whichever file happened to be nearby instead -- MEASURED, double-clicking\n    // mod.rs framed the region to its right, with future_incompat.rs half off screen.\n    //\n    // The half-extent has to be added BEFORE dividing by k, or this converts the\n    // file's LEFT edge to world space and centres that instead of the file: the\n    // second attempt put the file's top-left corner exactly at the viewport centre.\n    var worldCx = (box.left + box.width / 2 - r.left - view.x) / view.k\n    var worldCy = (box.top + box.height / 2 - r.top - view.y) / view.k\n    var k = Math.max(0.08, Math.min(24, Math.min((r.width - 40) / box.width, (r.height - 40) / box.height)))\n    view.k = k\n    view.x = r.width / 2 - worldCx * k\n    view.y = r.height / 2 - worldCy * k\n    applyView(document.getElementById(\"world\"))\n    reportView()\n    scheduleLod()\n  }\n\n  // ---- save as\n  //\n  // Reported more than once, and the gap it fills is real: the artifact arrives as a\n  // blob of text, and a reader who wants to keep it, mail it, or open it without a\n  // tool in the loop has no way to. So the page can save ITSELF.\n  //\n  // It re-serialises the live document rather than shipping a copy of the source\n  // string, so what is saved is what is on screen. A Blob and an object URL are used\n  // rather than a data: URI because a data: URI of a multi-megabyte document is\n  // rejected by several browsers, and this document is routinely 2-7 MB.\n  // THE CONTROL MOVED TO THE SIDEBAR; THE ABILITY STAYS HERE.\n  //\n  // Reported as \"the save as button does not work\", and the fix was to attach it by\n  // delegation before anything that could throw, because an exception during layout used\n  // to leave a visible, styled, completely inert button. The button itself is gone now:\n  // a save control in the corner of the picture is the chrome this pass removes, and the\n  // composed viewer's own Download section saves the whole page. The document keeps the\n  // ability, published as saveHtml on the API below, so a stand-alone copy of the map can\n  // still be written -- and the outcome is reported by whoever asked for it, since a save\n  // whose only feedback was a pill over the drawing is a save the reader cannot see fail.\n  function saveSelf(name) {\n    try {\n      var blob = new Blob([\"\u003c!DOCTYPE html>\" + String.fromCharCode(10) + document.documentElement.outerHTML], { type: \"text/html\" })\n      var url = URL.createObjectURL(blob)\n      var a = document.createElement(\"a\")\n      a.href = url\n      a.download = name\n      document.body.appendChild(a)\n      a.click()\n      document.body.removeChild(a)\n      setTimeout(function () { URL.revokeObjectURL(url) }, 4000)\n      return true\n    } catch (e) { return false }\n  }\n\n  window.addEventListener(\"resize\", function () {\n    // The world is derived from the viewport, so a resize means the layout has to be\n    // recomputed. But a reader who had zoomed IN is not thrown back out to the\n    // overview for having resized the window: their scale is kept, and only the\n    // geometry moves under them.\n    var wasZoomed = view.k > FIT_SCALE * 1.05\n    draw()\n    if (wasZoomed) { applyView(document.getElementById(\"world\")); reportView() }\n    else fitWorld()\n  })\n\n  // ── THE PUBLISHED API ────────────────────────────────────────────────────────\n  //\n  // The composed viewer renders ONE sidebar -- mode, layout, on-screen, data, filters,\n  // encoding, view, download -- and the mounted document is what knows those facts. A view\n  // that paints its own copies of them puts the drawing in a corner of its own chrome; this\n  // one publishes functions instead, and the sidebar is the only place they are drawn.\n  //\n  // Same shape as the graph view's, deliberately: the shell reads one contract whatever is\n  // mounted, and the rows it prints are the VIEW's words (see onScreenRows) rather than a\n  // vocabulary borrowed from another picture.\n  window.__bbView = {\n    kind: \"codemap\",\n    title: \"Symbol map\",\n    // The subtitle states the encoding AND what the view is NOT, because the name it used to\n    // carry (\"code map\") is the name of a different artifact: Sourcegraph's Chromium map draws\n    // every TOKEN of every file. This draws symbols, sized by the lines they span, because the\n    // index stores line spans and no tokens. Saying so here is cheaper than being asked.\n    subtitle: \"bb_visualize · area = the lines each SYMBOL spans, nested directory › file › symbol · colour = symbol kind, language from the index · this is a SYMBOL map, not a token-level code map\",\n    hint: \"scroll to zoom · drag to pan · double-click a file to fill the frame with it · click a file or symbol for its stored facts\",\n    census: censusRows,\n    note: excludedNote,\n    legend: legendRows,\n    encoding: encodingRows,\n    filters: filterOptions,\n    state: viewState,\n    // The two arrangements this document can draw, and which one is on screen. The choice\n    // is the sidebar's Layout section; before this pass it was two buttons in this file's\n    // own panel, which is the same duplication the census had.\n    layouts: function () { return [\n      { value: \"dir\", label: \"Directories\", hint: \"group files into the directory they live in -- the nesting is the one thing a force graph cannot show\" },\n      { value: \"lang\", label: \"Languages\", hint: \"group files by the language they are written in, so each language's mass is one rectangle\" },\n    ] },\n    layout: function () { return groupBy },\n    setLayout: function (next) {\n      var mode = next === \"lang\" ? \"lang\" : \"dir\"\n      if (mode === groupBy) return groupBy\n      groupBy = mode\n      // Re-framed, because the arrangement the reader was looking at has moved underneath\n      // them. A picked FILE survives: it is the same file, in a different cell.\n      draw()\n      fitWorld()\n      notify()\n      return groupBy\n    },\n    panel: panelState,\n    setPanel: setPanel,\n    data: dataPort,\n    fit: function () { fitWorld() },\n    // \"show everything\": the filters are the only thing this view hides, and the search and\n    // the pick are the reader's own position rather than a state to be undone.\n    reset: function () { hiddenKinds = {}; hiddenLangs = {}; changed() },\n    saveHtml: function () { return saveSelf(\"bb-code-map.html\") },\n  }\n  try {\n    // draw() FIRST, then fit. MEASURED: #world measures the viewport divided by FIT_SCALE and\n    // is only recomputed inside draw(), so fitting before the first draw framed the DEFAULT\n    // 2400x1600 world and then left the reader looking at a 52% view of a world that no longer\n    // existed -- the map opened smaller than the space it had, said scroll-out-to-see-all,\n    // and the labels were scaled down with it. Frame the world that was actually laid out.\n    draw()\n    fitWorld()\n  } catch (e) {\n    var z = document.getElementById(\"zoomstate\")\n    if (z) { z.className = \"on\"; z.textContent = \"This map could not be laid out (\" + String(e).slice(0, 120) + \"). The symbols are still in the page as JSON.\" }\n  }\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>","class":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\" data-bb-view=\"class\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Backbencher Type Diagram\u003c/title>\n\u003cstyle>\n  :root{\n    --bg:#08080c; --panel:rgba(16,17,26,.86); --edge:rgba(255,255,255,.14);\n    --text:#e8eaf0; --muted:#8b90a0; --accent:#5eead4; --warn:#fbbf24;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);\n    font:13px/1.5 ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;overflow:hidden}\n  #stage{position:absolute;inset:0}\n  svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}\n  svg.dragging{cursor:grabbing}\n  .panel{position:absolute;background:var(--panel);border:1px solid var(--edge);\n    border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);\n    box-shadow:0 10px 40px rgba(0,0,0,.55)}\n  #hud{top:16px;left:16px;padding:16px 18px;max-width:360px}\n  #hud h1{margin:0 0 2px;font-size:14px}\n  #hud .sub{color:var(--muted);font-size:12px}\n  #stats{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;\n    font-variant-numeric:tabular-nums}\n  #stats b{font-weight:600}\n  #stats span{color:var(--muted)}\n  #warn{color:var(--warn);margin-top:9px;font-size:12px}\n  .cls{position:absolute;background:#12141f;border:1.4px solid #a78bfa;border-radius:8px;\n    overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}\n  .cls.sel{border-color:#ffffff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}\n  .cls.dim{opacity:.25}\n  .cls .hd{background:rgba(167,139,250,.20);padding:3px 7px;font-size:11px;font-weight:600;\n    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(167,139,250,.35)}\n  .cls .sub2{padding:2px 7px;font-size:10px;color:var(--muted);white-space:nowrap;\n    overflow:hidden;text-overflow:ellipsis}\n  /* The member compartment — the part that makes this a class diagram rather than a\n     bag of names. Separated by a rule, because in UML this is a distinct compartment\n     and the reader needs to see that the type name and its members are different\n     kinds of thing. */\n  .cls .mem{border-top:1px solid rgba(167,139,250,.20);margin-top:3px;padding:3px 0 1px}\n  .cls .mrow{display:flex;align-items:center;gap:6px;padding:0 7px;height:15px;\n    font-size:10px;color:#cbd5f5;white-space:nowrap;overflow:hidden}\n  .cls .mrow .mk{color:var(--muted);flex:none;width:12px;text-align:center;font-size:9px}\n  .cls .mrow .mn{overflow:hidden;text-overflow:ellipsis;min-width:0}\n  .cls .mrow .ms{margin-left:auto;color:#fbbf24;font-size:8.5px;flex:none}\n  .cls .mrow.more{color:var(--muted);font-style:italic}\n  #legend{left:16px;bottom:16px;padding:14px 18px;max-width:360px;max-height:50vh;overflow:auto}\n  #legend h2{margin:0 0 8px;font-size:11px;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}\n  .row{display:flex;align-items:center;gap:9px;margin:3px 0;font-size:12px}\n  .row .mg{color:var(--muted);flex:none;width:14px;text-align:center;font-size:10px}\n  /* Overrides the readable-scale floor, so the reader can ask for the whole shape when\n     that is the question, without paying for it by default. */\n  #fitall{margin:0 0 8px;background:rgba(255,255,255,.06);border:1px solid var(--edge);\n    color:var(--text);border-radius:7px;padding:4px 10px;font:inherit;font-size:11.5px;cursor:pointer}\n  #fitall:hover{border-color:var(--accent);color:var(--accent)}\n  /* The relationships as text. A connector is only useful if you can follow it, and\n     hundreds of dashed lines across the canvas cannot be followed. This is the same\n     data the connectors are drawn from, so it cannot disagree with the picture, and it\n     is findable with Ctrl-F. */\n  #rel-list{margin:0;max-height:30vh;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;\n    font-size:10.5px;line-height:1.5;color:var(--muted);white-space:pre-wrap;word-break:break-word;\n    background:rgba(0,0,0,.30);border:1px solid var(--edge);border-radius:7px;padding:7px 8px}\n  .ln{width:30px;height:0;border-top-width:2px;flex:none}\n  #hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);\n    color:var(--muted);font-size:11.5px;background:var(--panel);border:1px solid var(--edge);\n    border-radius:999px;padding:6px 14px;max-width:40vw;white-space:nowrap;overflow:hidden;\n    text-overflow:ellipsis}\n  body.detail-open #hint{opacity:0;pointer-events:none}\n  /* The detail panel is HIDDEN until something is selected.\n   *\n   * MEASURED: with no rule of its own, the panel inherited .panel{position:absolute} and\n   * rendered at load as a 13x22 box at the top-left corner containing nothing but its close\n   * glyph (innerText U+2715) -- an empty panel over the diagram, in the one view whose\n   * siblings both hide theirs until there is something to say. The two rules below are the\n   * map's, and the anchors keep it out of the HUD's corner. */\n  #detail{right:16px;bottom:16px;padding:14px 18px;max-width:400px;max-height:44vh;\n    overflow:auto;display:none}\n  #detail.on{display:block}\n  @media (max-width:820px){#legend{display:none}#hud{max-width:60vw}}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"stage\">\n  \u003csvg id=\"c\">\u003cdefs>\n    \u003cmarker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      \u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#94a3b8\"/>\n    \u003c/marker>\n    \u003cmarker id=\"ah-hollow\" viewBox=\"0 0 14 14\" refX=\"13\" refY=\"7\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto-start-reverse\">\n      \u003cpath d=\"M13,0 L13,14 L0,7 z\" fill=\"#08080c\" stroke=\"#94a3b8\" stroke-width=\"1.6\"/>\n    \u003c/marker>\n  \u003c/defs>\u003cg id=\"edges\">\u003c/g>\u003c/svg>\n\u003c/div>\n\u003cdiv class=\"panel\" id=\"hud\">\n  \u003ch1>Type diagram\u003c/h1>\n  \u003cdiv class=\"sub\">bb_visualize &middot; types and relationships the index actually stores\u003c/div>\n  \u003cdiv class=\"sub\" style=\"margin-top:4px\">inheritance, implementation and containment only &middot; no attributes, methods, cardinalities or visibility, because the index does not store them\u003c/div>\n  \u003cdiv id=\"stats\">\u003c/div>\n  \u003cdiv id=\"warn\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"panel\" id=\"legend\">\n  \u003ch2>Relationships\u003c/h2>\n  \u003cbutton id=\"fitall\" class=\"fitbtn\">fit all\u003c/button>\n  \u003cdiv id=\"rel-rows\">\u003c/div>\n  \u003ch2 style=\"margin-top:12px\">In each box\u003c/h2>\n  \u003cdiv class=\"row\">\u003cspan class=\"mg\">()\u003c/span>\u003cspan>method\u003c/span>\u003c/div>\n  \u003cdiv class=\"row\">\u003cspan class=\"mg\">::\u003c/span>\u003cspan>field or property\u003c/span>\u003c/div>\n  \u003cdiv class=\"row\">\u003cspan class=\"mg\">=\u003c/span>\u003cspan>enum member\u003c/span>\u003c/div>\n  \u003cdiv class=\"row\" style=\"color:var(--muted)\">from the index's own containment links; at most six per box\u003c/div>\n  \u003ch2 style=\"margin-top:12px\">Relationships, as text\u003c/h2>\n  \u003cpre id=\"rel-list\">\u003c/pre>\n  \u003ch2 style=\"margin-top:12px\">What this does NOT show\u003c/h2>\n  \u003cdiv class=\"row\" style=\"color:var(--muted)\">parameter types and return types\u003c/div>\n  \u003cdiv class=\"row\" style=\"color:var(--muted)\">cardinalities or multiplicities\u003c/div>\n  \u003cdiv class=\"row\" style=\"color:var(--muted)\">anything the index does not store\u003c/div>\n\u003c/div>\n\u003cbutton id=\"savebtn\" class=\"fitbtn\" style=\"position:absolute;right:14px;top:14px;z-index:4\">save as&hellip;\u003c/button>\n\u003cdiv class=\"panel\" id=\"detail\">\u003cspan class=\"close\" id=\"dclose\">&#10005;\u003c/span>\u003cdiv id=\"dbody\">\u003c/div>\u003c/div>\n\u003cdiv id=\"hint\">drag to pan &middot; scroll to zoom &middot; click a type to focus its relationships\u003c/div>\n\u003cnoscript>\u003cp style=\"padding:24px\">This diagram needs JavaScript. The data is embedded below.\u003c/p>\u003c/noscript>\n\n\u003cscript id=\"bb-graph-data\" type=\"application/json\">\n{\"classes\":[],\"edges\":[],\"outside\":0,\"members\":0,\"boxesOmitted\":0,\"isolatedOmitted\":0,\"membersByClass\":{},\"totalNodesAvailable\":29,\"excluded\":{\"symbols\":0,\"byPattern\":{},\"byRule\":{},\"suffixes\":[\".d.ts\",\".min.js\",\".map\"],\"patterns\":[\"node_modules\",\".git\",\".next\",\".turbo\",\".cache\",\"coverage\",\"dist\",\"build\",\"out\",\"target\",\"vendor\",\"__pycache__\"],\"includesTestFiles\":true},\"scope\":\"project\",\"target\":null}\n\u003c/script>\n\u003cscript>\n(function () {\n  \"use strict\";\n  var G = JSON.parse(document.getElementById(\"bb-graph-data\").textContent);\n  var C = G.classes || [], E = G.edges || [];\n  // The member list a box shows, and the glyph beside each one. Declared at the TOP,\n  // before layout() -- see the note on MEMBERS below for why that position is load\n  // bearing rather than stylistic.\n  var MEMBERS = 6;\n  function memberMark(type) {\n    if (type === \"method\" || type === \"function\") return \"()\"\n    if (type === \"property\" || type === \"field\" || type === \"attribute\") return \"::\"\n    if (type === \"enum_member\" || type === \"variant\") return \"=\"\n    return \"-\"\n  }\n  var svg = document.getElementById(\"c\"), gE = document.getElementById(\"edges\");\n  var W = 0, H = 0, view = { x: 0, y: 0, k: 1 }, sel = null, hover = null;\n  var byId = {};\n  // Empty bands between consecutive lines of boxes, filled in by layout(). Connectors\n  // travel through these so a line never crosses a box it does not connect to.\n  var channels = [];\n  for (var i = 0; i \u003c C.length; i++) byId[C[i].id] = C[i];\n\n  function esc(s) {\n    return String(s == null ? \"\" : s).replace(/[&\u003c>\"]/g, function (c) {\n      return ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" })[c];\n    });\n  }\n\n  // The ancestry path of a box, used to order a depth so a child sits near its parent.\n  //\n  // The stored relationships give each type at most one parent here: the first\n  // extends/implements edge found, and failing that the first contains edge.\n  //\n  // Both, because MEASURED with inheritance alone the connectors stayed long: on cargo's\n  // src/compiler the median connector was 720px and the 90th percentile 1,567px in a\n  // 1,296px viewport -- 203 of the 304 are 'contains' between types, and those\n  // connect arbitrary pairs, so an ancestry that only follows inheritance left them\n  // stretched across the canvas. Following containment as well puts a struct next to\n  // the struct that holds it, which is also how a reader expects composition to look.\n  //\n  // Memoised, because a 400-box hierarchy asks for 400 paths.\n  var _keyMemo = {}\n  function ancestryKey(id, guard) {\n    if (_keyMemo[id] !== undefined) return _keyMemo[id]\n    if (guard[id]) return String((byId[id] || {}).name || id)\n    guard[id] = 1\n    var parent = null\n    for (var e = 0; e \u003c E.length && !parent; e++) {\n      if (E[e].target === id && (E[e].type === \"extends\" || E[e].type === \"implements\")) parent = E[e].source\n    }\n    for (var e2 = 0; e2 \u003c E.length && !parent; e2++) {\n      if (E[e2].type === \"contains\" && E[e2].target === id) parent = E[e2].source\n    }\n    var me = byId[id]\n    var out = parent ? ancestryKey(parent, guard) + \"/\" : \"\"\n    out += String((me || {}).name || id)\n    _keyMemo[id] = out\n    return out\n  }\n\n  // ---- layout: a real UML-ish arrangement, not a force soup.\n  //\n  // Boxes are placed on a grid ordered by hierarchy depth, because that is what\n  // makes inheritance READABLE: subclasses sit below their base, so \"these four\n  // extend this one\" is a visual fact rather than something to trace. A force layout\n  // would put the same information in the same place, less legibly.\n  function depthOf(id, seen) {\n    var d = 0, cur = id, guard = 0\n    while (guard++ \u003c 24) {\n      var up = null\n      for (var i = 0; i \u003c E.length; i++) {\n        var e = E[i]\n        if ((e.type === \"extends\" || e.type === \"implements\") && e.target === cur) { up = e.source; break }\n      }\n      if (!up || seen[up]) break\n      seen[up] = 1; cur = up; d++\n    }\n    return d\n  }\n  function layout() {\n    var n = C.length\n    for (var i = 0; i \u003c n; i++) {\n      var c = C[i]\n      c._depth = depthOf(c.id, {})\n      var span = (c.lineEnd || c.line || 0) - (c.line || 0) + 1\n      // Box area follows the type's gravity, mildly, and its height follows its line\n      // span — so a 400-line class is visibly bigger than a 3-line enum.\n      c._w = Math.max(150, Math.min(280, 150 + Math.sqrt(Math.max(1, span)) * 7))\n      // A UML box is a compartmented thing: the type's name above, its fields and\n      // methods below. MEASURED: cargo's src/compiler stores 834 'contains'\n      // relationships from types to properties and methods, which the previous\n      // version counted as \"969 undrawn inheritance relationships\" and drew nothing.\n      // Those links ARE the members, and they are already in the payload, so the\n      // boxes now list them and the diagram finally shows what a class contains.\n      c._members = (G.membersByClass && G.membersByClass[c.id]) || []\n      c._shown = Math.min(c._members.length, MEMBERS)\n      c._h = 34 + c._shown * 15 + (c._members.length > c._shown ? 14 : 0)\n    }\n    // Rows are separated by the tallest box in the row, so boxes do not overlap once\n    // they have grown to fit their members. The old fixed 190 left a 6-member box\n    // hanging into the row below.\n    var rowGap = function (row) {\n      var tallest = 0\n      for (var z = 0; z \u003c row.length; z++) if (row[z]._h > tallest) tallest = row[z]._h\n      return tallest + 46\n    }\n    var rows = {}\n    for (var j = 0; j \u003c n; j++) {\n      var d = C[j]._depth\n      if (!rows[d]) rows[d] = []\n      rows[d].push(C[j])\n    }\n    var depths = []\n    for (var k in rows) depths.push(Number(k))\n    depths.sort(function (p, q) { return p - q })\n    var COL = 30\n    // Rows WRAP, and stack by their own height rather than a fixed pitch.\n    //\n    // MEASURED from a screenshot of cargo's src/compiler: 135 types in one depth were\n    // laid out as a single row about 27,000 world units wide. Fitting the view to that\n    // row shrank it to scale 0.07 -- the whole diagram became a one-pixel ribbon, and\n    // the earlier version that did NOT fit simply ran 130 of the 135 boxes off both\n    // edges of the screen. Neither is a diagram; both come from treating a depth level\n    // as an infinite line.\n    //\n    // So each depth is a wrapped grid, and the running y is\n    // an ACCUMULATOR over the lines rather than a lookup keyed by depth. Keying it by\n    // depth was the earlier bug: with depths 0 and 2 and no row 1, the offset for depth\n    // 2 was never written, y became 40 + undefined, and the browser rejected those SVG\n    // connectors with a path attribute naming NaN. Depth gaps are normal in a real\n    // hierarchy, so that was not a corner case either.\n    //\n    // PER_LINE is per DEPTH, so it is computed inside the loop from that depth's own\n    // count. Reading it from the enclosing scope -- which is where it sat first --\n    // meant dereferencing a row that does not exist yet, and every box vanished.\n    var y = 40\n    // The empty band between two lines of boxes, and the extra space between depths.\n    // Both are the routing space: a connector that travels inside a band cannot cross a\n    // box, because the band is defined as the interval where no box exists.\n    var GAP = 34, DEPTH_GAP = 26\n    channels.length = 0\n    var lineNo = 0\n    for (var r = 0; r \u003c depths.length; r++) {\n      var row = rows[depths[r]]\n      var PER_LINE = columnsFor(row.length)\n      row.sort(function (p, q) { return (q.gravity || 0) - (p.gravity || 0) })\n      // THEN re-sort by ancestry, so a child sits under its parent.\n      //\n      // MEASURED from a screenshot: with the boxes ordered only by gravity, an\n      // implements edge ran the FULL width of the canvas between a parent and a child\n      // hundreds of cells apart, and 100 of them turned the diagram into spaghetti.\n      // The relationship was real and drawn; it was simply unreadable.\n      //\n      // A depth is ordered by the ANCESTRY PATH of each box -- the concatenated names\n      // of its parents, then its own -- which puts siblings next to each other and a\n      // child within a few columns of its parent. Gravity becomes the tie-break, so\n      // the busiest types still lead. The result is that connectors are short and\n      // mostly vertical, which is what makes a hierarchy read as one.\n      // A fresh cycle guard per box. Passing \"\" here is what the first version did, and\n      // writing guard[id] = 1 on a string throws, which took the whole layout down with\n      // a message about a property that looked nothing like the bug.\n      for (var oi = 0; oi \u003c row.length; oi++) row[oi]._key = ancestryKey(row[oi].id, {})\n      row.sort(function (p, q) {\n        if (p._key \u003c q._key) return -1\n        if (p._key > q._key) return 1\n        return (q.gravity || 0) - (p.gravity || 0)\n      })\n      var widest = 0\n      for (var m = 0; m \u003c row.length; m++) if (row[m]._w > widest) widest = row[m]._w\n      var lineW = PER_LINE * widest + (PER_LINE - 1) * COL\n      var lineH = 0\n      for (var li = 0; li * PER_LINE \u003c row.length; li++) {\n        lineNo++   // one per LINE of boxes, across every depth, so bands index cleanly\n        var slice = row.slice(li * PER_LINE, (li + 1) * PER_LINE)\n        var sliceW = slice.length * widest + (slice.length - 1) * COL\n        var x = -sliceW / 2\n        for (var t = 0; t \u003c slice.length; t++) {\n          slice[t].x = x; slice[t].y = y; slice[t]._line = lineNo\n          x += slice[t]._w + COL\n          if (slice[t]._h > lineH) lineH = slice[t]._h\n        }\n// The FREE SPACE below this line, recorded directly rather than reconstructed.\n        //\n        // MEASURED, reconstructing it from line offsets was wrong in a way that looked\n        // right: the derived band straddled the NEXT line's boxes, so a connector\n        // \"routed\" through it still crossed them -- 606 segments crossing boxes across\n        // 304 connectors, exactly the complaint. The band is now the literal interval\n        // between this line's tallest box and the next line's top, which is the only\n        // part of the canvas that is provably empty.\n        // Each box records which LINE it is on, and each band records which line it sits\n        // below. That is what lets a connector insist the band is the ADJACENT one.\n        //\n        // MEASURED, without it the router picked any band above the target and dropped\n        // the final stub through every row between: a path of [1129,321] -> [517,322] ->\n        // [517,653] crossed the boxes Meetings, Added and more, because the band at y=322\n        // was four rows above a target at y=653. A band that is not adjacent to the box\n        // it serves is worse than no routing at all -- it looks deliberate.\n        if (lineH > 0) channels.push({ y0: y + lineH, y1: y + lineH + GAP, line: lineNo - 1 })\n        y += lineH + GAP\n      }\n      y += DEPTH_GAP\n    }\n    // A CHANNEL between each pair of consecutive lines, recorded so connectors can\n    // travel through it. This is the fix for the complaint that a connector \"passes\n    // through boxes as if they are connected\": if A holds D, and B and C sit between\n    // them on screen, then a line drawn straight from A to D passes through B and C and\n    // reads as A->B->C->D. That is not a cosmetic complaint -- the picture is asserting\n    // a chain of relationships that does not exist, which is a diagram lying about the\n    // code.\n  }\n\n  // The grid shape is derived from the VIEWPORT, so layout has to wait until the\n  // viewport is measured -- and has to be re-runnable when that changes.\n  //\n  // MEASURED, and this is what made the diagram unnavigable: a fixed five boxes per\n  // line turned cargo's 600 project-scope types into 120 lines, roughly 27,000 world\n  // units tall against 1,400 wide. Fitting that put the scale at 0.04, so boxes were\n  // a few pixels each and zooming drifted into the empty space below them. A\n  // 120-line column is not a diagram, it is a list with extra steps.\n  //\n  // The column count now comes from the box count and the viewport's aspect, so the\n  // grid comes out roughly as wide as the space it is drawn in and fits at a\n  // readable scale. sqrt is the right shape because it is what balances a grid's two\n  // dimensions; the 1.35 biases toward fewer, wider columns, because a class name\n  // needs more room than a line of code does.\n  function columnsFor(n) {\n    var aspect = (W > 0 && H > 0) ? (W / Math.max(1, H)) : 1.5\n    return Math.max(3, Math.min(28, Math.round(Math.sqrt(Math.max(1, n) * aspect * 1.35))))\n  }\n\n  function toScreen(x, y) { return [W / 2 + (x * view.k + view.x), H / 2 + (y * view.k + view.y)] }\n\n  // How many connectors share each band, so each can be given its own lane inside it.\n  // Without this every connector between the same two lines draws along exactly the\n  // same y and N relationships look like one.\n  var laneUse = {}\n  /** The SVG path for one connector, routed through empty space. */\n  function routeFor(a, b, idx) {\n    var p1 = toScreen(a.x + a._w / 2, a.y + a._h)\n    var p2 = toScreen(b.x + b._w / 2, b.y)\n\n    // Find a band this connector can travel through.\n    //\n    // BELOW first: the natural route for a parent above its child.\n    //\n    // Then ABOVE, which is what makes the SAME-LINE case work. MEASURED: 207 of 304\n    // connectors had no band below them, and almost all of those were two boxes in one\n    // line -- depthOf follows the first inheritance edge, and with only 534 'implements'\n    // and 8 'extends' against 7,186 types, almost every type is a root, so almost every\n    // box sits in depth 0 and most 'contains' edges join two boxes in the same line. A\n    // band below does not exist between two boxes on one line, so those connectors had\n    // no gap to use and fell back to the midpoint elbow, which crosses whatever boxes lie\n    // between them -- exactly the \"a -> b -> c -> d\" reading that was reported.\n    //\n    // Detouring UP and over the line is box-free by the same argument: the band above a\n    // line is empty, and the two vertical stubs live in it.\n    var band = null\n    var dir = 1\n    var sameLine = a._line === b._line\n    // The band must be ADJACENT to the line it serves, or the final stub crosses\n    // everything in between. Each case names which adjacency it needs.\n    var wantLine = sameLine ? b._line : b._line - 1     // the band directly above b\n    var wantUp = a._line - 1                             // the band directly above a\n    for (var c = 0; c \u003c channels.length; c++) {\n      if (channels[c].line === wantLine && channels[c].y0 >= a.y + a._h - 1) { band = channels[c]; dir = 1; break }\n    }\n    if (!band) {\n      for (var c2 = channels.length - 1; c2 >= 0; c2--) {\n        if (channels[c2].line === (sameLine ? b._line - 1 : wantUp)) { band = channels[c2]; dir = -1; break }\n      }\n    }\n    if (!band) {\n      // Non-adjacent only as a last resort, and then it is a plain vertical run, which\n      // at least does not pretend to be a routed connector.\n      for (var c3 = 0; c3 \u003c channels.length; c3++) {\n        var ch3 = channels[c3]\n        if (ch3.y0 >= a.y + a._h - 1 && ch3.y1 \u003c= b.y + 1) { band = ch3; dir = 1; break }\n      }\n    }\n\n    // Still nothing -- the two boxes are on the same line and there is no band on\n    // either side of it, which happens only on the outermost rows. A plain elbow is\n    // drawn and hop-marks are added by the same code that handles every other\n    // connector, so it cannot read as a routed one it is not.\n    if (!band) {\n      var mid = (p1[1] + p2[1]) / 2\n      return withHops([[p1[0], p1[1]], [p1[0], mid], [p2[0], mid], [p2[0], p2[1]]], a, b)\n    }\n\n    // Its own lane inside the band. The lane count grows with use so parallel\n    // connectors separate rather than overlap, and is capped so a popular band does not\n    // grow taller than the gap it lives in.\n    var key = Math.round(band.y0) + \":\" + Math.round(band.y1)\n    var used = laneUse[key] || 0\n    laneUse[key] = used + 1\n    var span = Math.max(1, band.y1 - band.y0)\n    var lanes = Math.min(5, Math.max(1, Math.round(span / 4)))\n    var laneY = dir > 0\n      ? band.y0 + 3 + (used % lanes) * Math.max(1, (span - 5) / lanes)\n      : band.y1 - 3 - (used % lanes) * Math.max(1, (span - 5) / lanes)\n    if (laneY \u003c band.y0 + 1) laneY = band.y0 + 1\n    if (laneY > band.y1 - 1) laneY = band.y1 - 1\n\n    var up = toScreen(0, laneY)\n    // dir -1 detours UP and over the line: leave the source from its TOP, come down\n    // into the target's top. Both anchors are on the same side, which is what keeps the\n    // two vertical stubs inside the empty band rather than crossing the line's boxes.\n    var aTop = toScreen(a.x + a._w / 2, a.y)\n    var bTop = toScreen(b.x + b._w / 2, b.y)\n    if (sameLine && dir > 0) {\n      // Out of the bottom of both, along the band, back up into the target's bottom.\n      var aBot = toScreen(a.x + a._w / 2, a.y + a._h)\n      var bBot = toScreen(b.x + b._w / 2, b.y + b._h)\n      return withHops([[aBot[0], aBot[1]], [aBot[0], up[1]], [bBot[0], up[1]], [bBot[0], bBot[1]]], a, b)\n .\n  //\n  // Fit is applied ONCE, on load. Re-fitting on every resize would yank the picture\n  // back to the overview every time the window changed, undoing whatever the reader had\n  // zoomed to.\n  function fitAll(force) {\n    if (!C.length) return\n    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity\n    for (var i = 0; i \u003c C.length; i++) {\n      var c = C[i]\n      if (c.x \u003c x0) x0 = c.x\n      if (c.x + c._w > x1) x1 = c.x + c._w\n      if (c.y \u003c y0) y0 = c.y\n      if (c.y + c._h > y1) y1 = c.y + c._h\n    }\n    // A readable FLOOR under the fit.\n    //\n    // MEASURED: cargo's src/compiler has 135 types, and fitting all of them shrinks the\n    // boxes to a few pixels -- an overview nobody can read, which is not an overview of\n    // anything. So the load-time fit is clamped: below this scale the diagram opens\n    // showing a legible portion of itself and the reader pans, which is a smaller ask\n    // than being handed 135 illegible boxes. \"Fit all\" overrides the floor, because\n    // sometimes the shape of the whole IS the question.\n    var MIN_READABLE = 0.55\n    var k = Math.min((W - 80) / Math.max(1, x1 - x0), (H - 80) / Math.max(1, y1 - y0))\n    k = Math.max(0.02, Math.min(1, k))\n    if (!force && k \u003c MIN_READABLE) k = MIN_READABLE\n    view.k = k\n    // Centre on the whole diagram when it fits, and align the TOP of it when it\n    // does not: centring a much taller world shows the middle of the grid, which\n    // hides the highest-gravity types the ordering just put first.\n    //\n    // The top alignment is expressed against the viewport centre, because toScreen\n    // adds H/2: setting the offset to -y0*k leaves the first row just BELOW the middle\n    // (a screenshot showed two thirds of the viewport empty above the diagram), where\n    // the top of the world needs to land at 40px from the top instead.\n    view.x = -(x0 + x1) / 2 * k\n    view.y = (force || k > MIN_READABLE) ? -(y0 + y1) / 2 * k : 40 - H / 2 - y0 * k\n  }\n  // ---- THE BUTTONS, ATTACHED FIRST AND BY DELEGATION.\n  //\n  // Reported as \"the fit all and save as buttons do not work\". They worked here, which\n  // is the interesting part: the handlers were assigned at the END of the script, so\n  // ANY exception thrown during layout or the first render left the buttons present,\n  // visible, styled and completely inert. The symptom is exactly \"there is a button\n  // and clicking it does nothing\", and nothing in the console points at the cause\n  // because the throw happened earlier and was swallowed by the event loop.\n  //\n  // So the controls are bound by ONE delegated listener on document, installed here --\n  // above every line that can throw -- and dispatching on the target's id. A handler\n  // that cannot be lost to a later failure is worth more than one attached in the\n  // tidiest place, because the tidiest place is exactly the one that runs last.\n  //\n  // It also survives a re-render, which per-element onclick does not: the boxes are\n  // rebuilt on every paint, and anything rebuilt by the renderer has to have its\n  // handler reattached or it is dead again.\n  function saveSelf(name) {\n    try {\n      var blob = new Blob([\"\u003c!DOCTYPE html>\" + String.fromCharCode(10) + document.documentElement.outerHTML], { type: \"text/html\" })\n      var url = URL.createObjectURL(blob)\n      var a = document.createElement(\"a\")\n      a.href = url\n      a.download = name\n      document.body.appendChild(a)\n      a.click()\n      document.body.removeChild(a)\n      setTimeout(function () { URL.revokeObjectURL(url) }, 4000)\n      return true\n    } catch (e) { return false }\n  }\n  document.addEventListener(\"click\", function (ev) {\n    var t = ev.target\n    while (t && t !== document) {\n      if (t.id === \"fitall\") { fitAll(true); return }\n      if (t.id === \"savebtn\") {\n        // A sandboxed frame -- an IDE webview, an MCP preview pane -- can refuse the\n        // download without throwing, which is the other way \"save\" appears broken.\n        // So the outcome is stated on screen either way rather than left silent.\n        var okSave = saveSelf(\"bb-class-diagram.html\")\n        var w = document.getElementById(\"warn\")\n        if (w) {\n          w.textContent = okSave\n            ? \"Saved. The file is the page as it is now on screen, self-contained, with no network.\"\n            : \"This frame refused the download. Open the file directly, or use your browser's own Save command.\"\n        }\n        return\n      }\n      t = t.parentNode\n    }\n  }, false)\n\n  try {\n    resize()\n    // Fit AFTER the viewport has a real size. MEASURED from the rendered artifact: at first\n    // paint svg.clientWidth/Height are 0 (the element is positioned but not yet laid out),\n    // so the fit was computed against a zero-width viewport -- view.x/y centred on nothing\n    // and the picture opened with its top and left edges cut off, which is what screenshot 03\n    // showed. resize() re-fits the first time it sees a non-zero size.\n    fitAll(false)\n    render()\n  } catch (e) {\n    // Stated rather than swallowed: a blank canvas with a working-looking button and\n    // nothing in the console is the worst of the three outcomes.\n    var w0 = document.getElementById(\"warn\")\n    if (w0) {\n      w0.textContent = \"This diagram could not be laid out (\" + String(e).slice(0, 140) +\n        \"). The types and relationships are still in the page source as JSON.\"\n    }\n  }\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>"}
</script>
<script>

    (function () {
      var docs = JSON.parse(document.getElementById("bb-studio-data").textContent);
      var frame = document.getElementById("view");
      var modesEl = document.getElementById("modes");
      var buttons = Array.prototype.slice.call(document.querySelectorAll(".mode"));
      var titleEl = document.getElementById("viewTitle");
      var subEl = document.getElementById("viewSub");
      var liveEl = document.getElementById("live");
      var censusEl = document.getElementById("census");
      var noteEl = document.getElementById("note");
      var viewNoteEl = document.getElementById("viewNote");
      var fallbackEl = document.getElementById("fallback");
      var filtersEl = document.getElementById("filters");
      var encodingEl = document.getElementById("encoding");
      var filterSection = document.getElementById("filterSection");
      var encodingSection = document.getElementById("encodingSection");
      var actionSection = document.getElementById("actionSection");
      var layoutSection = document.getElementById("layoutSection");
      var layoutsEl = document.getElementById("layouts");
      var layoutHintEl = document.getElementById("layoutHint");
      var fitBtn = document.getElementById("fit");
      var clearBtn = document.getElementById("clear");
      var statusEl = document.getElementById("status");
      var dlButtons = Array.prototype.slice.call(document.querySelectorAll(".dl"));
      var labels = { graph: "Graph", codemap: "Symbol map", class: "Type diagram" };
      var liveTimer = 0;
      // The arrangement the READER picked, held by the page rather than by the mount. The
      // documents are static strings, so without this a trip to another mode and back
      // would hand them the layout the file was generated with and quietly undo their
      // choice -- a switch that forgets is a switch the reader has to work twice.
      var chosenLayout = null;

      // WHICH DOCUMENT IS IN THE FRAME, read from the document itself.
      //
      // The sidebar used to key its geometry off the SLOT it had mounted, and the two
      // can disagree the moment a document arrives in the wrong slot. Every renderer
      // declares data-bb-view on its own <html>, and the panel reads that first, so a
      // document that describes itself is described correctly wherever it lands.
      function documentView() {
        var doc = frame.contentDocument;
        var declared = doc && doc.documentElement && doc.documentElement.getAttribute("data-bb-view");
        return declared || frame.dataset.mode;
      }
      /** The mounted view's published API, or null for a view that has none yet. */
      function api() {
        try {
          var win = frame.contentWindow;
          return (win && win.__bbView) || null;
        } catch (e) { return null; }
      }
      function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }
      function span(cls, text) { var s = document.createElement("span"); s.className = cls; if (text != null) s.textContent = text; return s; }

      // ── the live line: what the view actually holds right now ─────────────
      // ── the live line: what the VIEW says is on screen right now ─────────────
      //
      // The rows come from the view, in the view's own words. MEASURED while adding the code
      // map to this sidebar: the line used to be composed HERE, out of st.visibleNodes,
      // st.visibleEdges and st.regionLinks, so the shell had to know what a region link was
      // -- and a code map mounted in the frame would have been described as "nodes 1412 of
      // 1412, edges 0 of 0": the graph's vocabulary, and the graph's counts, for a picture
      // that has no edges. A view publishes state(); it can publish what to print with it.
      function updateLive() {
        var view = api();
        if (!view || !view.state) { liveEl.textContent = "\u2014"; return; }
        var rows = view.state().onScreen || [];
        clear(liveEl);
        if (!rows.length) { liveEl.textContent = "\u2014"; return; }
        rows.forEach(function (r, i) {
          if (i) liveEl.appendChild(span("sep", "\u00b7"));
          // Three tones, because the view distinguishes them: a headline count (label, bold
          // value), an explanation that belongs in the same breath (plain), and a caveat the
          // reader should notice (warn). A row marked as a caveat must not be the loudest
          // thing in the line.
          var cls = r.warn ? "warn" : r.tone === "plain" ? "plain" : "";
          if (r.label) liveEl.appendChild(span(cls, r.label + " "));
          if (cls) liveEl.appendChild(span(cls, String(r.value)));
          else liveEl.appendChild(bold(r.value));
        });
      }
      function bold(text) { var b = document.createElement("b"); b.textContent = text; return b; }

      // ── the census and the exclusion note, straight from the view ─────────
      function renderData(view) {
        clear(censusEl);
        clear(noteEl);
        if (!view || !view.census) { censusEl.className = "kv"; return; }
        censusEl.className = "kv";
        (view.census() || []).forEach(function (row) {
          var el = document.createElement("div");
          el.className = "row" + (row.warn ? " warn" : "");
          var v = span("v", String(row.value));
          var k = span("k", row.label);
          el.appendChild(v); el.appendChild(k);
          censusEl.appendChild(el);
        });
        if (view.note) noteEl.textContent = view.note();
      }

      // ── filters: this is the "other instructions like relationship types" the
      //    reader asked to keep beside the graph rather than in a corner of it ──
      function renderFilters(view) {
        clear(filtersEl);
        var list = (view && view.filters && view.filters()) || [];
        list.forEach(function (f) {
          var group = document.createElement("div");
          group.className = "fgroup";
          var head = document.createElement("div");
          head.className = "fhead";
          head.appendChild(span("flab", f.label));
          var all = document.createElement("button");
          all.type = "button";
          all.className = "fclear";
          all.textContent = "all";
          all.addEventListener("click", function () {
            f.options.forEach(function (o) { if (f.hidden(o.value)) f.set(o.value, true); });
            renderFilters(view); updateLive();
          });
          head.appendChild(all);
          group.appendChild(head);
          var opts = document.createElement("div");
          opts.className = "fopts";
          f.options.forEach(function (o) {
            var hidden = f.hidden(o.value);
            var b = document.createElement("button");
            b.type = "button";
            b.className = "fopt" + (hidden ? " off" : "");
            b.setAttribute("aria-pressed", hidden ? "false" : "true");
            b.title = hidden ? o.value + " is hidden \u2014 click to show" : o.value + " \u2014 click to hide";
            var sw = span("sw" + (o.dash === "dashed" ? " dashed" : ""));
            if (o.color) sw.style.background = o.color;
            b.appendChild(sw);
            b.appendChild(span("fl", o.value));
            b.appendChild(span("ct", String(o.count)));
            b.addEventListener("click", function () {
              f.set(o.value, f.hidden(o.value));
              renderFilters(view);
              updateLive();
            });
            opts.appendChild(b);
          });
          group.appendChild(opts);
          filtersEl.appendChild(group);
        });
        filterSection.classList.toggle("hide", !list.length);
      }

      // ── the layout choice: the graph view's own arrangement, offered where the
      //    reader is already looking. A view that publishes no layouts hides this
      //    section entirely, because a switch that switches nothing is a lie.
      function renderLayouts(view) {
        clear(layoutsEl);
        var list = (view && view.layouts && view.layouts()) || [];
        layoutSection.classList.toggle("hide", !list.length);
        if (!list.length) { layoutHintEl.textContent = ""; return; }
        var current = (view.layout && view.layout()) || "regions";
        list.forEach(function (l) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "lay" + (l.value === current ? " active" : "");
          b.textContent = l.label;
          b.setAttribute("aria-pressed", l.value === current ? "true" : "false");
          b.title = l.hint || l.label;
          b.addEventListener("click", function () {
            var v = api();
            chosenLayout = l.value;
            if (v && v.setLayout) v.setLayout(l.value);
            refresh();
            flash("layout: " + l.label);
          });
          layoutsEl.appendChild(b);
        });
        var active = list.filter(function (l) { return l.value === current; })[0] || list[0];
        layoutHintEl.textContent = active && active.hint ? active.hint : "";
      }

      // ── the encoding key ─────────────────────────────────────────────────
      function renderEncoding(view) {
        clear(encodingEl);
        var rows = (view && view.encoding && view.encoding()) || [];
        rows.forEach(function (r) {
          var row = document.createElement("div");
          row.className = "krow";
          var sw;
          if (r.color === "lang") sw = span("langs");
          else if (r.swatch === "ring") { sw = span("ring"); sw.style.borderColor = r.color; }
          else if (r.swatch === "line") { sw = span("bar"); sw.style.borderTopColor = r.color; }
          else { sw = span("dot"); sw.style.background = r.color; }
          row.appendChild(sw);
          row.appendChild(span("", r.text));
          encodingEl.appendChild(row);
        });
        encodingSection.classList.toggle("hide", !rows.length);
      }

      // ── downloads ────────────────────────────────────────────────────────
      function download(name, text, mime) {
        try {
          var blob = new Blob([text], { type: mime });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
          flash("saved " + name);
        } catch (e) {
          flash("this frame refused the download \u2014 use the browser Save command");
        }
      }
      function csvCell(value) {
        var s = value == null ? "" : String(value);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }
      function csv(headers, rows) {
        return headers.join(",") + "\n" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\n") + "\n";
      }
      function downloadData(kind) {
        var view = api();
        var data = view && view.data ? view.data() : null;
        if (!data) { flash("this view has no data port yet \u2014 its sidebar pass is next"); return; }
        if (kind === "json") { download("bb-visualize-data.json", JSON.stringify(data, null, 2), "application/json"); return; }
        if (kind === "nodes") {
          download("bb-visualize-nodes.csv", csv(
            ["id", "name", "type", "language", "file", "line", "lineEnd", "qualifiedName", "gravity", "stale"],
            (data.nodes || []).map(function (n) { return [n.id, n.name, n.type, n.group, n.filePath, n.line, n.lineEnd, n.qualifiedName, n.gravity, n.stale === true]; }),
          ), "text/csv");
          return;
        }
        download("bb-visualize-edges.csv", csv(
          ["source", "target", "type", "occurrences", "confidence", "evidenceTier", "crossLanguage", "stale", "rowId"],
          (data.links || []).map(function (l) { return [l.source, l.target, l.type, l.occurrences, l.confidence, l.evidenceTier, l.crossLanguage === true, l.stale === true, l.rowId]; }),
        ), "text/csv");
      }
      /** Which download ports the mounted view actually has.
       *
       *  Empty is not the same as absent: a view with no edges is asked for its links and
       *  answers with an empty list, which means "there is nothing to download", while a view
       *  with no data port at all means "this is not built yet". The two are reported
       *  differently on the buttons. */
      function dataPorts(view) {
        try {
          var d = view.data();
          return { json: !!d, nodes: !!(d && d.nodes && d.nodes.length), edges: !!(d && d.links && d.links.length) };
        } catch (e) { return null; }
      }
      function flash(message) {
        statusEl.textContent = message;
        statusEl.classList.add("flash");
        setTimeout(function () { statusEl.classList.remove("flash"); statusEl.textContent = labels[frame.dataset.mode] + " view loaded"; }, 3200);
      }

      // ── rebuild everything the sidebar shows for the mounted document ────
      function refresh() {
        var view = api();
        var declared = documentView();
        var label = labels[declared] || "View";
        titleEl.textContent = (view && view.title) || (declared === "codemap" ? "Symbol map" : declared === "class" ? "Type diagram" : label);
        subEl.textContent = (view && view.subtitle) || "bb_visualize \u00b7 self-contained \u00b7 no network";
        renderData(view);
        renderFilters(view);
        renderLayouts(view);
        // A mount that came back in the other arrangement is corrected here, and the
        // switch is re-rendered so the active chip is the one actually drawing.
        if (declared === "graph" && chosenLayout && view && view.layout && view.setLayout && view.layout() !== chosenLayout) {
          view.setLayout(chosenLayout);
          renderLayouts(api());
        }
        renderEncoding(view);
        // The downloads are per PORT, not per view. MEASURED while adding the code map: the
        // three buttons were switched together whenever a view published data() at all, so a
        // code map -- which draws no edges -- handed out an edges.csv holding nothing but its
        // header. A control that downloads an empty file is a control that lies, so the port
        // decides, and the title names which one is missing and why.
        var ports = view && view.data ? dataPorts(view) : null;
        dlButtons.forEach(function (b) {
          var kind = b.dataset.dl;
          b.disabled = kind !== "page" && !(ports && ports[kind]);
          b.title = !b.disabled ? ""
            : !ports ? "this view publishes no data port yet"
            : kind === "edges" ? "this view draws no edges"
            : "this view has no " + kind + " port";
        });
        fitBtn.disabled = !(view && view.fit);
        clearBtn.disabled = !(view && view.reset);
        // The instruction line belongs to the VIEW, published as its hint port, for the same reason
        // the rows above do: the shell used to hold the graph's sentence and print NOTHING for
        // any other view, so a mounted code map had an empty View section while its own fading
        // hint pill over the drawing was the only place its gestures were written down.
        viewNoteEl.textContent = (view && view.hint) || "";
        fallbackEl.hidden = !!view;
        if (!view) {
          // Accurate about what is on screen: with no API there is no census to print and no
          // data port to download, so the sections are EMPTY and the downloads disabled rather
          // than filled with another view's numbers.
          fallbackEl.textContent = label + " does not publish a sidebar API yet, so the census, the filters, the encoding key and the data downloads below are disabled rather than filled with another view's numbers \u2014 they arrive in its own pass. The drawing and its own controls are in the frame.";
        }
        updateLive();
      }

      function mount(next) {
        frame.dataset.mode = next;
        frame.addEventListener("load", refresh, { once: true });
        frame.srcdoc = docs[next];
        buttons.forEach(function (button) {
          button.classList.toggle("active", button.dataset.mode === next);
          button.setAttribute("aria-selected", button.dataset.mode === next ? "true" : "false");
        });
        statusEl.textContent = labels[next] + " view loaded";
        if (liveTimer) clearInterval(liveTimer);
        liveTimer = setInterval(updateLive, 700);
      }

      buttons.forEach(function (button) {
        button.addEventListener("click", function () { mount(button.dataset.mode); });
      });
      fitBtn.addEventListener("click", function () { var v = api(); if (v && v.fit) v.fit(); });
      clearBtn.addEventListener("click", function () {
        var v = api();
        if (v && v.reset) v.reset();
        refresh();
      });
      dlButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          var kind = button.dataset.dl;
          if (kind === "page") { download("bb-visualize.html", "<!DOCTYPE html>\n" + document.documentElement.outerHTML, "text/html"); return; }
          downloadData(kind);
        });
      });
      mount("class");
    }());
  
</script>
</body>
</html>
