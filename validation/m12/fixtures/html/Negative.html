<!DOCTYPE html>
<html>
<head>
  <title>Negative Cases</title>
</head>
<body>
  <!-- Anonymous structural tags: no id, no class -> NO symbols -->
  <div>
    <span>plain text</span>
    <ul>
      <li>item one</li>
      <li>item two</li>
    </ul>
  </div>

  <!-- javascript: anchors are not navigation uses -->
  <a href="javascript:void(0)">no-op</a>
  <a href="#">empty anchor</a>

  <!-- Template placeholders / no resource value -->
  <img src="">
  <iframe src="" loading="lazy"></iframe>

  <!-- Duplicate id: both map to the same symbol name, single symbol -->
  <div id="dup-target" class="one">first</div>
  <div id="dup-target" class="two">second</div>

  <!-- label for with no matching id -> unresolved, emits nothing -->
  <label for="missing-input">No match</label>

  <!-- Anchor to a nonexistent id -> unresolved, emits nothing -->
  <a href="#no-such-id">dead link</a>

  <!-- Anchor to the existing dup-target id -> resolves once -->
  <a href="#dup-target">go to dup</a>
</body>
</html>
