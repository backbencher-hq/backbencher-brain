# The private development repository runs the E7 cross-platform evidence legs. The filtered
# release tree does not publish the lane-owned evidence set, so here the same runners prove the
# shipped artefact instead: install, build, and run the built CLI on each OS.
name: OS matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  os-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (shipped dist server)
        run: npm run build

      - name: Shipped-binary smoke on ${{ matrix.os }}
        shell: bash
        run: |
          node bin/bb --version
          node bin/bb --help >/dev/null
          echo "release-tree smoke OK on ${{ matrix.os }}"
