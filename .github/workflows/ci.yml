name: CI

# The public repository is the filtered release tree: it publishes the engine, its
# documentation, the grammar sources and the editor integrations. It does not publish
# website/ (its own repository), skills/ (its own repository) or the internal validation
# ledgers, so the workflows that need those inputs belong to the repositories that own
# them. This workflow verifies what is actually published here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify the release tree
        run: npm test
